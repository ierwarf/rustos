[alias]
xtask = "run -q -p xtask --"

# No `[target.x86_64-unknown-linux-gnu]` block, and two flags that were tried
# and removed rather than never considered:
#
#   -Clink-arg=-fuse-ld=lld  This target's linker-flavor is already gnu-lld-cc,
#                            so rustc links with the toolchain's own rust-lld.
#                            Forcing the flag only swaps that for whatever
#                            ld.lld sits on PATH - an external, version-skewed
#                            dependency in exchange for the linker we already
#                            had.
#
#   -Zthreads=8              The parallel front-end dropped a monomorphized
#                            instance from `wayclick`; the link then failed on
#                            an undefined `<DispatchError as
#                            From<WaylandError>>::from`. A missing
#                            instantiation is a miscompilation, and `cargo
#                            xtask check` cannot see it because checking never
#                            links. Its artifacts also poison a target tree:
#                            a later, correct build reused them and failed the
#                            same way until the tree was removed.
#
# Anything added here reaches ordinary build/test/check only. Kernel and nucleus
# builds go through `apply_kernel_cargo_env`, which sets the RUSTFLAGS
# environment variable outright, and Cargo discards `target.*.rustflags`
# whenever that variable is present. Express host tuning as `rustflags`, never
# as a `linker` key: `target.*.linker` is *not* suppressed by the environment
# variable and would follow the kernel into its link step.

[unstable]
# Stop duplicating each crate's metadata into its `.rlib` when a `.rmeta`
# already carries it. Pure disk saving: same artifacts, same semantics.
no-embed-metadata = true
# Let Cargo age out unused registry sources and caches under CARGO_HOME on its
# own. This governs the Cargo home cache, not `target/` -- the target tree is
# what `cargo xtask clean --stale` is for.
gc = true
