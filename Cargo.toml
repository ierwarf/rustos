[workspace]

members = [
    "boot/bootloader",
    "boot/bootloader/boot-protocol",
    "boot/prekernel",
    "libs/boot-random",
    "libs/diag-abi",
    "libs/diag-client",
    "libs/runtime-control",
    "libs/storage-core",
    "libs/storage-fat",
    "libs/trace-loc-macro",
    "kernel",
    "kernel/base",
    "kernel/lowlevel",
    "kernel/hal",
    "kernel/mm",
    "kernel/object",
    "kernel/ipc-runtime",
    "kernel/ps",
    "kernel/io-manager",
    "kernel/compat",
    "kernel/executive",
    "services/initd",
    "services/storaged",
    "services/inputd",
    "services/debugd",
    "services/runtimed",
    "services/sessiond",
    "services/uiserver",
    "apps/debugctl",
    "apps/wayclick",
    "drivers/libs/driver-abi",
    "drivers/libs/driver-module-runtime",
    "drivers/libs/keyboard-core",
    "drivers/bridges/display/bootfb",
    "drivers/bridges/display/amdgpu",
    "drivers/bridges/input/keyboard",
    "tests/module-tests",
    "tools/xtask",
]
resolver = "3"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
