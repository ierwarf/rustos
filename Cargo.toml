[workspace]

members = [
    "boot/boot-protocol",
    "kernel/nucleus-core",
    "libs/boot-random",
    "libs/driver-domain-protocol",
    "libs/driver-domain-host",
    "libs/rustos-image-admission",
    "libs/observability-client",
    "libs/runtime-control",
    "libs/rustos-user-abi",
    "libs/rustos-svc-runtime",
    "libs/rustos-fault-injection",
    "libs/rustos-observability",
    "libs/storage-core",
    "libs/storage-fat",
    "libs/trace-loc-macro",
    "kernel",
    "kernel/lowlevel",
    "kernel/hal",
    "kernel/mm",
    "kernel/object",
    "kernel/ipc-runtime",
    "kernel/ps",
    "kernel/io-manager",
    "kernel/compat",
    "kernel/executive",
    "services/rootd",
    "services/initd",
    "services/storaged",
    "services/inputd",
    "services/syscalld",
    "services/pagerd",
    "services/vfsd",
    "services/netd",
    "services/devmgrd",
    "services/loaderd",
    "services/procd",
    "services/runtimed",
    "services/sessiond",
    "services/uiserver",
    "apps/ipcbench",
    "apps/wayclick",
    "drivers/libs/input-evdev",
    "drivers/libs/keyboard-core",
    "tests/contract-tests",
    "tools/xtask",
    "tools/hostd",
]
resolver = "3"

# A single cargo invocation cannot build every member. `no_std` service
# binaries such as vfsd and syscalld define their own `panic_impl`, while
# host members such as uiserver and xtask pull the same shared dependencies
# with their `std` feature on. Cargo unifies features across whatever it is
# asked to build, so a union of the two halves links std into a freestanding
# binary and rustc rejects the duplicate lang item. The split does not follow
# tools-versus-RustOS either: uiserver and netd are std services, vfsd and
# syscalld are not.
#
# Each half builds cleanly on its own, so `default-members` pins the default
# to the host half and plain `cargo build`, `cargo test`, and `cargo clippy`
# work at the repo root. The freestanding half is built per package, with its
# target and link line, by `cargo xtask build`.
#
# `cargo build --workspace` explicitly asks for the union and still fails.
# That is the invocation to avoid; `cargo xtask check` is the whole-tree gate.
default-members = [
    "libs/driver-domain-host",
    "libs/observability-client",
    "libs/runtime-control",
    "libs/trace-loc-macro",
    "services/initd",
    "services/storaged",
    "services/inputd",
    "services/netd",
    "services/devmgrd",
    "services/runtimed",
    "services/sessiond",
    "services/uiserver",
    "apps/ipcbench",
    "apps/wayclick",
    "tests/contract-tests",
    "tools/xtask",
    "tools/hostd",
]


[profile.release]
panic = "abort"

# `release` is the profile the nucleus, the image, and every `cargo xtask bench`
# baseline are built under. Its codegen settings are load-bearing for those
# recorded cycle counts, so size and speed tuning stays out of it -- a change
# here silently reprices every `min` column the bench baselines compare against.

[profile.dev]
panic = "abort"
# Full DWARF for 48 workspace crates plus their dependency closure is what made
# `target/debug` grow past 40G, and emitting and linking it is also a large part
# of a debug build's wall time. Line tables keep every backtrace's file and line
# number -- what panics and test failures actually report -- and drop only the
# variable-inspection data a source debugger would want.
debug = "line-tables-only"
# Leave debug info in the object files instead of copying it into each output
# binary. The linker stops moving DWARF around, which is the single largest cost
# in a link once LLD is doing the linking.
split-debuginfo = "unpacked"

# Dependencies are not what anyone steps through here, and their debug info was
# the bulk of `target/debug/deps`. Workspace crates keep the line tables set
# above; this applies to the closure outside the workspace only.
[profile.dev.package."*"]
debug = false

# Build scripts and proc macros are run, never stepped through, so their debug
# info is pure overhead. Optimizing them was measured too and did not pay for
# itself -- a cold build of the xtask closure went from 10.96s to 13.01s -- so
# only the debug info is dropped here.
[profile.dev.build-override]
debug = false
