[logging]
enabled = true
boot_trace_enabled = false
serial_mirror = false
ring_buffer_bytes = 16384
min_level = "info"

[logging.categories]
boot = "info"
panic = "fatal"
memory = "info"
sched = "info"
syscall = "off"
process = "info"
driver = "info"
storage = "info"
usb = "info"
input = "info"
display = "info"
vfs = "info"
console = "info"
service = "info"
compat = "info"
debug = "info"
heartbeat = "info"

[fault_injection]
# Normal boots do not pay the fault-rule lock on hot allocation/device paths.
# Hardening runs enable one exact registered rule through RUSTOS_FAULTS.
enabled = false
rules = [
    "alloc.frame=off",
    "block.flush=off",
    "block.read=off",
    "block.write=off",
    "display.present=off",
    "display.provider.register=off",
    "handle.commit=off",
    "handle.reserve=off",
    "ipc.endpoint.enqueue=off",
    "ipc.endpoint.reply=off",
    "process.spawn=off",
    "waitset.register=off",
]

[fuzzing]
# Disabled by default so normal UI smoke boots are not perturbed by ABI fuzzers.
# Set enabled=true to autostart apps/abifuzz after wayclick has launched.
enabled = false
fd_transfer_stress = false
startup_delay_ms = 1500

[lock_telemetry]
# Disabled by default because lock timing warnings add overhead and can be noisy.
# Enable for hardening runs to surface hidden contention and long critical sections.
enabled = false
# Per-phase cycle attribution inside every tracked lock acquire and release.
#
# This is eleven counter reads and twenty-two atomic adds wrapped around an
# operation that costs a few hundred cycles, and the kernel takes about thirty
# tracked locks per synchronous IPC round trip. Measured by building with it
# stubbed out, it was 26 percent of `ipc_rt_intra_process`, 28 percent of the
# call-to-recv half, and zero of `null_syscall_getpid`, which takes no lock.
#
# It stays in the tree because it is what identified the global process-table
# binds, the CPUID-per-IPI exit, and the queue lock inside the pick scans. Turn
# it on for a diagnosis run -- `RUSTOS_LOCK_PHASE_PROFILE=true cargo xtask bench
# --build` -- and read the result as the cost of an instrumented lock, not of a
# lock.
phase_profile = false
warn_wait_cycles = 250000
warn_hold_cycles = 250000

[kernel.build]
# Hardened/release-oriented kernel build knobs. Copy this block, or this whole
# file, into config/rustos.toml when testing a release-shaped image.

codegen_units = 1
opt_level = "2"
overflow_checks = true
debug_assertions = false
lto = "thin"
force_frame_pointers = true
incremental = false
debuginfo = "1"
embed_bitcode = true
panic = "abort"
relocation_model = "none"
strip = "none"
extra_rustflags = []
