[logging]
enabled = true
boot_trace_enabled = false
serial_mirror = true
ring_buffer_bytes = 16384
min_level = "info"

[logging.categories]
boot = "info"
panic = "fatal"
memory = "info"
sched = "info"
syscall = "off"
process = "info"
driver = "info"
storage = "info"
usb = "info"
input = "info"
display = "info"
vfs = "info"
console = "info"
service = "info"
compat = "info"
debug = "info"
heartbeat = "off"

[fault_injection]
# Runtime fault profiles are enabled for hardening runs. The default rule is
# non-failing; replace "off" with fail, drop-every:N, fail-after:N, rate:N, or
# delay-ms:N to exercise a fault path.
enabled = true
rules = [
    "alloc.frame=off",
    "block.read=off",
    "block.write=off",
    "display.present=off",
    "display.provider.register=off",
    "driver.module.load=off",
    "input.event.enqueue=off",
    "pci.config.read=off",
    "process.spawn=off",
    "socket.recv=off",
    "socket.send=off",
    "virtio-gpu.control.submit=off",
]

[kernel.build]
# Hardened/release-oriented kernel build knobs. Copy this block, or this whole
# file, into config/rustos.toml when testing a release-shaped image.

codegen_units = 1
opt_level = "0"
overflow_checks = true
debug_assertions = false
lto = "thin"
force_frame_pointers = true
incremental = false
debuginfo = "1"
embed_bitcode = true
panic = "abort"
relocation_model = "none"
strip = "none"
extra_rustflags = []
