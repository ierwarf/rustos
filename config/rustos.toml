[logging]
enabled = true
boot_trace_enabled = false
serial_mirror = false
ring_buffer_bytes = 16384
min_level = "info"

[logging.categories]
boot = "info"
panic = "fatal"
memory = "info"
sched = "info"
syscall = "off"
process = "info"
driver = "info"
storage = "info"
usb = "info"
input = "info"
display = "info"
vfs = "info"
console = "info"
service = "info"
compat = "info"
debug = "info"
heartbeat = "info"

[fault_injection]
# Normal boots do not pay the fault-rule lock on hot allocation/device paths.
# Hardening runs enable one exact registered rule through RUSTOS_FAULTS.
enabled = false
rules = [
    "alloc.frame=off",
    "block.flush=off",
    "block.read=off",
    "block.write=off",
    "display.present=off",
    "display.provider.register=off",
    "handle.commit=off",
    "handle.reserve=off",
    "ipc.endpoint.enqueue=off",
    "ipc.endpoint.reply=off",
    "process.spawn=off",
    "waitset.register=off",
]

[fuzzing]
# Disabled by default so normal UI smoke boots are not perturbed by ABI fuzzers.
# Set enabled=true to autostart apps/abifuzz after wayclick has launched.
enabled = false
fd_transfer_stress = false
startup_delay_ms = 1500

[lock_telemetry]
# Disabled by default because lock timing warnings add overhead and can be noisy.
# Enable for hardening runs to surface hidden contention and long critical sections.
enabled = false
# Per-phase cycle attribution inside every tracked lock acquire and release.
#
# This is eleven counter reads and twenty-two atomic adds wrapped around an
# operation that costs a few hundred cycles, and the kernel takes about thirty
# tracked locks per synchronous IPC round trip. Measured by building with it
# stubbed out, it was 26 percent of `ipc_rt_intra_process`, 28 percent of the
# call-to-recv half, and zero of `null_syscall_getpid`, which takes no lock.
#
# It stays in the tree because it is what identified the global process-table
# binds, the CPUID-per-IPI exit, and the queue lock inside the pick scans. Turn
# it on for a diagnosis run -- `RUSTOS_LOCK_PHASE_PROFILE=true cargo xtask bench
# --build` -- and read the result as the cost of an instrumented lock, not of a
# lock.
phase_profile = false
warn_wait_cycles = 250000
warn_hold_cycles = 250000

[scheduler_telemetry]
# Per-phase nanosecond attribution inside every scheduler dispatch, plus the
# handoff- and pick-scan stopwatches.
#
# This is about seventeen `lfence; rdtsc` reads and their accumulators per
# dispatch, wrapped around phases that are individually cheap -- the same shape
# as `lock_telemetry.phase_profile` and found the same way. Measured by building
# with it stubbed out: `sched_yield` -11.7 percent, `ipc_rt_intra_process` -3.8
# percent, and zero on `null_syscall_getpid`, which performs no dispatch.
#
# It stays in the tree because the phase split is what attributes a dispatch at
# all. Turn it on for a diagnosis run --
# `RUSTOS_SCHEDULER_PHASE_PROFILE=true cargo xtask bench` -- and read the result
# as the cost of an instrumented dispatch, not of a dispatch.
phase_profile = false

[syscall_telemetry]
# Per-phase cycle attribution across the syscall entry and exit path.
#
# Seven `rdtsc` reads per syscall and their accumulators, to attribute a path
# whose cheapest member is 1,640 ticks -- the third instance of the shape
# `lock_telemetry.phase_profile` and `scheduler_telemetry.phase_profile` already
# carry, and found the same way. Measured by building with it stubbed out, twice
# with the anchor at exactly zero: `null_syscall_getpid` -12.8 percent both
# times, `ipc_try_recv_empty` -8.8 and -7.5 percent.
#
# It stays in the tree because it is what priced the per-syscall XSAVE pair at
# 829 ticks and got it deleted. Turn it on for a diagnosis run --
# `RUSTOS_SYSCALL_PHASE_PROFILE=true cargo xtask bench` -- and read the result as
# the cost of an instrumented syscall, not of a syscall.
phase_profile = false

[lifecycle_telemetry]
# Emits an exact checksum-framed marker for spawn/exec/exit/reap stages. Each
# marker carries process slot+generation, MM generation, and a non-reusable
# transaction ID. Debugcon formatting is intentionally expensive, so keep this
# off for shipping latency measurements and enable it only for an identity/
# fault trace: `RUSTOS_LIFECYCLE_TRACE=true cargo xtask bench --build`.
phase_profile = false

[kernel.build]
# Hardened/release-oriented kernel build knobs. Copy this block, or this whole
# file, into config/rustos.toml when testing a release-shaped image.

codegen_units = 1
opt_level = "2"
overflow_checks = true
debug_assertions = false
lto = "thin"
force_frame_pointers = true
incremental = false
debuginfo = "1"
embed_bitcode = true
panic = "abort"
relocation_model = "none"
strip = "none"
extra_rustflags = []
