[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
boot-protocol = { path = "../../boot/bootloader/boot-protocol" }
boot-random = { path = "../../shared/boot-random" }
storage-core = { path = "../../shared/storage-core" }
storage-fat = { path = "../../shared/storage-fat" }
driver-abi = { path = "../../drivers/driver-abi" }
keyboard-core = { path = "../../drivers/input/keyboard-core" }
bitflags = { version = "2.11", default-features = false }
log = { version = "0.4", default-features = false }
buddy_system_allocator = "0.12.0"
embedded-graphics = { version = "0.8", default-features = false }
fatfs = { git = "https://github.com/rafalh/rust-fatfs", default-features = false, features = ["alloc", "lfn"] }
byteorder = { version = "1.5", default-features = false }
crc32fast = { version = "1.5", default-features = false }
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["no_std", "general", "ioctl", "auxvec"] }
hidreport = { version = "0.6.0", default-features = false }
object = { version = "0.38.1", default-features = false, features = ["read_core", "elf"] }
xhci = { version = "0.9.2", default-features = false }
vte = { version = "0.15.0", default-features = false }

lazy_static = { version = "1.4", features = ["spin_no_std"] }
spin = "0.10.0"
volatile = "0.6.1"
x86_64 = { version = "0.15.4", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
pic8259 = "0.11.0"

xmas-elf = { version = "0.9", default-features = false }
zune-core = { version = "0.4", default-features = false }
zune-jpeg = { version = "0.4", default-features = false }
