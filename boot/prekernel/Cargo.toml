[package]
name = "prekernel"
version = "0.1.0"
edition = "2024"

[dependencies]
boot-protocol = { path = "../bootloader/boot-protocol" }
boot-random = { path = "../../shared/boot-random" }
storage-core = { path = "../../shared/storage-core" }
storage-fat = { path = "../../shared/storage-fat" }
buddy_system_allocator = "0.12.0"
embedded-graphics = { version = "0.8", default-features = false }
fatfs = { git = "https://github.com/rafalh/rust-fatfs", default-features = false, features = ["alloc", "lfn"] }
spin = "0.10.0"
x86_64 = { version = "0.15.4", default-features = false, features = ["instructions"] }
object = { version = "0.38.1", default-features = false, features = ["read_core", "elf"] }
