id = "abifuzz"
kind = "app"
execution_domain = "user"
profiles = ["default"]
startup = "session"
runtime_deps = ["wayclick"]

[build]
builder = "c-demo"
source = "abifuzz.c"

[install]
path = "apps/abifuzz/abifuzz.elf"

[[desktop.entries]]
display_name = "ABI fuzzer"
weight_micros = 100
logical_admin = false
console_hosted = false
no_display = true
