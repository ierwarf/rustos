id = "wayclick"
kind = "app"
execution_domain = "user"

[build]
builder = "cargo-kernel-binary"
package = "wayclick"

[install]
path = "apps/wayclick/wayclick.elf"


[[desktop.entries]]
display_name = "WayClick"
# Foreground frame-callback work shares the ordinary User scheduler class but
# needs an explicit interactive fair-share weight under DVM input stress.
weight_micros = 1000
console_hosted = false
env = ["RUSTOS_WAYCLICK_PROFILE=0"]
