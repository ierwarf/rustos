id = "netprobe"
kind = "app"
execution_domain = "user"
startup = "session"

[build]
builder = "c-demo"
source = "netprobe.c"

[install]
path = "apps/netprobe/netprobe.elf"

[[desktop.entries]]
display_name = "netprobe"
weight_micros = 100
logical_admin = true
console_hosted = false
no_display = true
env = ["RUSTOS_NETPROBE_QEMU=0"]
