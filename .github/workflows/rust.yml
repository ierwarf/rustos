name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_RUSTC_WRAPPER: ""
  RUSTC_WRAPPER: ""
  RUSTOS_CONFIG: config/presets/release.toml

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Install pinned Rust toolchain
      run: |
        toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
        rustup toolchain install "$toolchain" \
          --profile minimal \
          --component rust-src \
          --component rustfmt \
          --component clippy \
          --target x86_64-unknown-linux-gnu \
          --target x86_64-unknown-uefi
        rustup show
    - name: Cache Cargo
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml', 'config/**/*.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    - name: Check repository execution infrastructure
      run: |
        git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
        .codex/hooks/selftest.sh
        tools/check-dev-environment.sh
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check RustOS config
      run: cargo xtask config check
    - name: Check OS build
      run: cargo xtask check
    - name: Run host tests
      run: >
        cargo test
        -p xtask
        -p runtime-control
        -p rustos-observability
        -p storage-core
        -p storage-fat
        -p trace-loc-macro
        -p boot-random
        -p driver-abi
        -p keyboard-core

  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Cache formal toolchains
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/bin/cargo-kani
          ~/.cargo/bin/kani
          ~/.kani
          ~/.cache/rustos/tla
          ~/.cache/rustos/verus
          ~/.cargo/registry
        key: ${{ runner.os }}-formal-${{ hashFiles('formal/tla2tools.lock', 'formal/kani.lock', 'formal/verus.lock', 'formal/models.tsv', 'rust-toolchain.toml') }}
        restore-keys: |
          ${{ runner.os }}-formal-
    - name: Install Java for TLC
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install pinned Kani verifier
      run: bash formal/setup-kani.sh
    - name: Install pinned Verus proof kernel
      run: bash formal/setup-verus.sh
    - name: Verify RustOS formal contracts and implementation boundaries
      run: bash formal/verify-all.sh --profile pr
    - name: Upload formal evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: formal-pr-evidence
        path: build/formal
        if-no-files-found: warn
        retention-days: 14

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Install pinned Rust toolchain
      run: rustup show
    - name: Cache Cargo
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/mdbook
        key: ${{ runner.os }}-mdbook-${{ hashFiles('rust-toolchain.toml') }}
        restore-keys: |
          ${{ runner.os }}-mdbook-
    - name: Install mdBook
      run: |
        if ! mdbook --version 2>/dev/null | grep -qx 'mdbook v0.4.52'; then
          cargo install mdbook --version 0.4.52 --locked --force
        fi
    - name: Build documentation
      run: mdbook build
    - name: Upload documentation artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: mdbook-site
        path: build/mdbook
        if-no-files-found: error
        retention-days: 7

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Download documentation artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: mdbook-site
        path: build/mdbook
    - name: Configure Pages
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
      with:
        path: build/mdbook
    - name: Deploy Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
