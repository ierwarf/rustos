name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install pinned Rust toolchain
      run: rustup show
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check OS build
      run: cargo xtask check
    - name: Run host tests
      run: >
        cargo test
        -p xtask
        -p runtime-control
        -p rustos-observability
        -p storage-core
        -p storage-fat
        -p trace-loc-macro
        -p boot-random
        -p driver-abi
        -p keyboard-core

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install pinned Rust toolchain
      run: rustup show
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/mdbook
        key: ${{ runner.os }}-mdbook-${{ hashFiles('rust-toolchain.toml') }}
        restore-keys: |
          ${{ runner.os }}-mdbook-
    - name: Install mdBook
      run: |
        if ! command -v mdbook >/dev/null 2>&1; then
          cargo install mdbook --version 0.4.52 --locked
        fi
    - name: Build documentation
      run: mdbook build
    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: mdbook-site
        path: build/mdbook
        if-no-files-found: error

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Download documentation artifact
      uses: actions/download-artifact@v4
      with:
        name: mdbook-site
        path: build/mdbook
    - name: Configure Pages
      uses: actions/configure-pages@v5
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/mdbook
    - name: Deploy Pages
      id: deployment
      uses: actions/deploy-pages@v4
