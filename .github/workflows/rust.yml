name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_RUSTC_WRAPPER: ""
  RUSTC_WRAPPER: ""
  RUSTOS_CONFIG: config/presets/release.toml

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deliberately small: formatting, the workspace build, and the host test set.
# The formal gate, QEMU/KVM runs, and documentation publishing are run locally
# from `formal/verify-all.sh` and `cargo xtask`, not here.
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Install pinned Rust toolchain
      run: |
        toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
        rustup toolchain install "$toolchain" \
          --profile minimal \
          --component rust-src \
          --component rustfmt \
          --target x86_64-unknown-linux-gnu \
          --target x86_64-unknown-uefi
        rustup show
    - name: Cache Cargo
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml', 'config/**/*.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check RustOS config
      run: cargo xtask config check
    - name: Check OS build
      run: cargo xtask check
    - name: Run host tests
      run: >
        cargo test
        -p xtask
        -p runtime-control
        -p rustos-observability
        -p storage-core
        -p storage-fat
        -p trace-loc-macro
        -p boot-random
        -p driver-domain-protocol
        -p rustos-user-abi
        -p keyboard-core
        -p rustos-driver-domain-host
