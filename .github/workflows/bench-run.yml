# One-shot baseline after formal-profile/runtime-mode decoupling.
name: RustOS self-hosted bench

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/bench-run.yml"

permissions:
  contents: read

concurrency:
  group: rustos-self-hosted-bench
  cancel-in-progress: true

jobs:
  bench:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          clean: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" \
            --profile minimal \
            --component rust-src \
            --target x86_64-unknown-linux-gnu \
            --target x86_64-unknown-uefi

      - name: Environment preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "node=$(uname -n)"
          id
          test -r /dev/kvm
          test -w /dev/kvm
          qemu-system-x86_64 --version | head -n 1
          command -v objdump
          command -v x86_64-w64-mingw32-gcc
          command -v pacman
          command -v curl
          command -v bsdtar

      - name: Bootstrap user-local DVM build tools
        shell: bash
        run: |
          set -euo pipefail
          toolroot="$RUNNER_TEMP/rustos-host-tools"
          mkdir -p "$toolroot"

          bootstrap_pkg() {
            pkg="$1"
            cmd="$2"
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "$cmd=system"
              return 0
            fi
            mapfile -t urls < <(pacman -Sp --print-format '%l' "$pkg")
            if [ "${#urls[@]}" -eq 0 ]; then
              echo "unable to resolve Arch package: $pkg" >&2
              return 1
            fi
            for url in "${urls[@]}"; do
              archive="$RUNNER_TEMP/$(basename "$url")"
              curl --fail --location --silent --show-error "$url" -o "$archive"
              bsdtar -xf "$archive" -C "$toolroot"
            done
            export PATH="$toolroot/usr/bin:$PATH"
            command -v "$cmd"
          }

          bootstrap_pkg bc bc
          bootstrap_pkg rsync rsync
          bootstrap_pkg cpio cpio
          bootstrap_pkg unzip unzip
          echo "$toolroot/usr/bin" >> "$GITHUB_PATH"

      - name: Verify cached Linux DVM bundle
        shell: bash
        run: |
          set -euo pipefail
          manifest="driver-domains/linux/out/artifacts/rustos-linux-dvm-x86_64.manifest"
          test -f "$manifest"
          cargo xtask verify-dvm
          echo "dvm_bundle=cached_verified"

      - name: Benchmark control 1 - 1 vCPU
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/ci-bench
          set +e
          cargo xtask bench --rustos-vcpus 1 --baseline build/ci-bench/control-1.txt > build/ci-bench/control-1.log 2>&1
          rc=$?
          set -e
          echo "bench_control_1_exit=$rc"
          awk '/^probe[[:space:]]+iters/{show=1} show{print}' build/ci-bench/control-1.log | tail -n 260
          if [ "$rc" -ne 0 ]; then tail -n 180 build/ci-bench/control-1.log; fi
          exit "$rc"

      - name: Benchmark control 2 - same tree 1 vCPU
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cargo xtask bench --rustos-vcpus 1 --compare build/ci-bench/control-1.txt > build/ci-bench/control-2.log 2>&1
          rc=$?
          set -e
          echo "bench_control_2_exit=$rc"
          awk '/^probe[[:space:]]+iters/{show=1} show{print}' build/ci-bench/control-2.log | tail -n 300
          if [ "$rc" -ne 0 ]; then
            tail -n 180 build/ci-bench/control-2.log
            exit "$rc"
          fi
          if ! grep -Eq '^  anchor vmexit_cpuid: [0-9]+ -> [0-9]+ \([+-]?[0-9]+\.[0-9]+%\) -- held$' build/ci-bench/control-2.log; then
            echo 'benchmark control rejected: vmexit_cpuid anchor did not hold within the xtask 3% admission bound' >&2
            grep -E '^  anchor vmexit_cpuid:|^comparison vs |no comparison:' build/ci-bench/control-2.log >&2 || true
            exit 1
          fi

      - name: Benchmark SMP baseline - 8 vCPU
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cargo xtask bench --rustos-vcpus 8 --baseline build/ci-bench/control-8vcpu.txt > build/ci-bench/control-8vcpu.log 2>&1
          rc=$?
          set -e
          echo "bench_8vcpu_exit=$rc"
          awk '/^probe[[:space:]]+iters/{show=1} show{print}' build/ci-bench/control-8vcpu.log | tail -n 260
          if [ "$rc" -ne 0 ]; then tail -n 180 build/ci-bench/control-8vcpu.log; fi
          exit "$rc"
