name: RustOS self-hosted bench

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/bench-run.yml"
      - "compat/windows/services/winsys/**"
      - "apps/windows/userdemo2/**"
      - "tools/xtask/**"
      - "kernel/**"
      - "libs/**"
      - "services/**"
      - "docs/benchmarks/**"
      - "docs/ai/performance-hardening.md"

permissions:
  contents: read

concurrency:
  group: rustos-self-hosted-bench
  cancel-in-progress: true

jobs:
  bench:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          clean: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" \
            --profile minimal \
            --component rust-src \
            --target x86_64-unknown-linux-gnu \
            --target x86_64-unknown-uefi

      - name: Environment preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "node=$(uname -n)"
          id
          test -r /dev/kvm
          test -w /dev/kvm
          qemu-system-x86_64 --version | head -n 1
          command -v objdump
          command -v x86_64-w64-mingw32-gcc
          command -v pacman
          command -v curl
          command -v bsdtar

      - name: Bootstrap user-local DVM build tools
        shell: bash
        run: |
          set -euo pipefail
          toolroot="$RUNNER_TEMP/rustos-host-tools"
          mkdir -p "$toolroot"

          bootstrap_pkg() {
            pkg="$1"
            cmd="$2"
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "$cmd=system"
              return 0
            fi
            mapfile -t urls < <(pacman -Sp --print-format '%l' "$pkg")
            if [ "${#urls[@]}" -eq 0 ]; then
              echo "unable to resolve Arch package: $pkg" >&2
              return 1
            fi
            for url in "${urls[@]}"; do
              archive="$RUNNER_TEMP/$(basename "$url")"
              curl --fail --location --silent --show-error "$url" -o "$archive"
              bsdtar -xf "$archive" -C "$toolroot"
            done
            export PATH="$toolroot/usr/bin:$PATH"
            command -v "$cmd"
          }

          bootstrap_pkg bc bc
          bootstrap_pkg rsync rsync
          bootstrap_pkg cpio cpio
          bootstrap_pkg unzip unzip
          echo "$toolroot/usr/bin" >> "$GITHUB_PATH"

      - name: Prepare Linux DVM bundle
        shell: bash
        run: |
          set -euo pipefail
          manifest="driver-domains/linux/out/artifacts/rustos-linux-dvm-x86_64.manifest"
          if [ -f "$manifest" ]; then
            set +e
            cargo xtask verify-dvm > /tmp/rustos-dvm-verify.log 2>&1
            verify_rc=$?
            set -e
            if [ "$verify_rc" -eq 0 ]; then
              echo "dvm_bundle=cached_verified"
              exit 0
            fi
            echo "cached DVM rejected; rebuilding"
            tail -n 80 /tmp/rustos-dvm-verify.log
          fi
          make -C driver-domains/linux build-plan
          cargo xtask build-dvm
          cargo xtask verify-dvm
          echo "dvm_bundle=built_verified"

      - name: Probe canonical loader spawn paths
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- \
            services/rootd/src/main.rs \
            services/initd/src/main.rs \
            services/runtimed/src/spawn.rs \
            services/loaderd/src/main.rs \
            services/vfsd/src/main.rs
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "services/rootd/src/main.rs",
              '''    request.requester_pid = requester_pid as u64;
    request.scheduling_context = register_scheduling_context_authority(
        path,
        request.requester_pid,
        scheduling_context_policy_for_exec(path),
    )
    .map_err(i64::from)?;
    request.flags = SPAWN_FLAG_LOGICAL_ADMIN as u32 | LOADER_SPAWN_FLAG_DEFER_START;
    request.weight_micros = weight_micros;
    request.exec_path_len = path.len() as u32;
    request.argv_count = 1;
    request.argv_bytes_len = (path.len() + 1) as u32;
    copy_bytes(path, &mut request.exec_path);
    copy_bytes(path, &mut request.argv_bytes);
    request.argv_bytes[path.len()] = 0;
''',
              '''    request.requester_pid = requester_pid as u64;
    let mut canonical_path_storage = [0_u8; LOADER_SPAWN_EXEC_PATH_CAPACITY];
    let canonical_path = if path.first() == Some(&b'/') {
        path
    } else {
        let canonical_len = path.len() + 1;
        if canonical_len > canonical_path_storage.len() {
            return Err(22);
        }
        canonical_path_storage[0] = b'/';
        copy_bytes(path, &mut canonical_path_storage[1..]);
        &canonical_path_storage[..canonical_len]
    };
    request.scheduling_context = register_scheduling_context_authority(
        canonical_path,
        request.requester_pid,
        scheduling_context_policy_for_exec(canonical_path),
    )
    .map_err(i64::from)?;
    request.flags = SPAWN_FLAG_LOGICAL_ADMIN as u32 | LOADER_SPAWN_FLAG_DEFER_START;
    request.weight_micros = weight_micros;
    request.exec_path_len = canonical_path.len() as u32;
    request.argv_count = 1;
    request.argv_bytes_len = (path.len() + 1) as u32;
    copy_bytes(canonical_path, &mut request.exec_path);
    copy_bytes(path, &mut request.argv_bytes);
    request.argv_bytes[path.len()] = 0;
''')

          for path in ("services/initd/src/main.rs", "services/runtimed/src/spawn.rs"):
              replace_once(
                  path,
                  '''    let exec_bytes = exec_path.as_bytes();
''',
                  '''    let canonical_exec_path = if exec_path.starts_with('/') {
        exec_path.to_owned()
    } else {
        format!("/{exec_path}")
    };
    let exec_bytes = canonical_exec_path.as_bytes();
''')
              replace_once(
                  path,
                  '''        scheduling_context: request_scheduling_context_authority(exec_path)?,
''',
                  '''        scheduling_context: request_scheduling_context_authority(canonical_exec_path.as_str())?,
''')

          replace_once(
              "services/loaderd/src/main.rs",
              'const UI_SERVER_EXEC_PATH: &str = "services/uiserver/uiserver.elf";',
              'const UI_SERVER_EXEC_PATH: &str = "/services/uiserver/uiserver.elf";')
          replace_once(
              "services/vfsd/src/main.rs",
              'const UI_SERVER_EXEC_PATH: &[u8] = b"services/uiserver/uiserver.elf";',
              'const UI_SERVER_EXEC_PATH: &[u8] = b"/services/uiserver/uiserver.elf";')
          PY
          cargo fmt --all
          git diff --check
          git diff -- \
            services/rootd/src/main.rs \
            services/initd/src/main.rs \
            services/runtimed/src/spawn.rs \
            services/loaderd/src/main.rs \
            services/vfsd/src/main.rs | sed -n '1,260p'

      - name: Benchmark control 1 - 1 vCPU
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/ci-bench
          set +e
          cargo xtask bench --rustos-vcpus 1 --baseline build/ci-bench/control-1.txt > build/ci-bench/control-1.log 2>&1
          rc=$?
          set -e
          echo "bench_control_1_exit=$rc"
          grep -E -m 160 '^(tsc_khz|probe|[-]{10,}|tsc_overhead|null_syscall|sched_yield|ipc_|vmexit_|derived:|  cross-process|  round trip|anchor|comparison|error|Error|failed|FAILED)|ipcbench:' build/ci-bench/control-1.log || true
          if [ "$rc" -ne 0 ]; then tail -n 120 build/ci-bench/control-1.log; fi
          exit "$rc"

      - name: Benchmark control 2 - same tree 1 vCPU
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cargo xtask bench --rustos-vcpus 1 --compare build/ci-bench/control-1.txt > build/ci-bench/control-2.log 2>&1
          rc=$?
          set -e
          echo "bench_control_2_exit=$rc"
          grep -E -m 200 '^(tsc_khz|probe|[-]{10,}|tsc_overhead|null_syscall|sched_yield|ipc_|vmexit_|derived:|  cross-process|  round trip|  anchor|anchor|comparison|error|Error|failed|FAILED)|ipcbench:' build/ci-bench/control-2.log || true
          if [ "$rc" -ne 0 ]; then
            tail -n 120 build/ci-bench/control-2.log
            exit "$rc"
          fi
          if ! grep -Eq '^  anchor vmexit_cpuid: [0-9]+ -> [0-9]+ \([+-]?[0-9]+\.[0-9]+%\) -- held$' build/ci-bench/control-2.log; then
            echo 'benchmark control rejected: vmexit_cpuid anchor did not hold within the xtask 3% admission bound' >&2
            grep -E '^  anchor vmexit_cpuid:|^comparison vs |no comparison:' build/ci-bench/control-2.log >&2 || true
            exit 1
          fi

      - name: Benchmark SMP baseline - 8 vCPU
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cargo xtask bench --rustos-vcpus 8 --baseline build/ci-bench/control-8vcpu.txt > build/ci-bench/control-8vcpu.log 2>&1
          rc=$?
          set -e
          echo "bench_8vcpu_exit=$rc"
          grep -E -m 160 '^(tsc_khz|probe|[-]{10,}|tsc_overhead|null_syscall|sched_yield|ipc_|vmexit_|derived:|  cross-process|  round trip|anchor|comparison|error|Error|failed|FAILED)|ipcbench:' build/ci-bench/control-8vcpu.log || true
          if [ "$rc" -ne 0 ]; then tail -n 120 build/ci-bench/control-8vcpu.log; fi
          exit "$rc"
