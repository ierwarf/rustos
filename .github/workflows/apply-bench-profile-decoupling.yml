name: Apply benchmark formal profile decoupling

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/apply-bench-profile-decoupling.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          clean: false

      - name: Apply profile/runtime decoupling
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/patch_bench_formal_profile_override.py
          cargo fmt --all
          git diff --check

      - name: Validate xtask and source contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test -q -p xtask
          cargo xtask check
          bash formal/run-source-conformance.sh

      - name: Push source-only fix
        shell: bash
        run: |
          set -euo pipefail
          git add \
            tools/xtask/src/bench.rs \
            tools/xtask/src/kvm/options.rs \
            tools/xtask/src/kvm/smoke_args.rs \
            tools/xtask/src/kvm/guest.rs
          git diff --cached --check
          git config user.name "ierwarf"
          git config user.email "64543544+ierwarf@users.noreply.github.com"
          git commit -m "fix(bench): decouple SMP formal profile from runtime mode"
          git push origin HEAD:master
