name: Apply canonical loader spawn fix

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/apply-canonical-loader-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          clean: false

      - name: Restore already-validated source patch
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 697b4e41^{commit}
          git checkout 697b4e41 -- \
            services/rootd/src/main.rs \
            services/initd/src/main.rs \
            services/runtimed/src/spawn.rs \
            services/loaderd/src/main.rs \
            services/vfsd/src/main.rs
          git diff --check

      - name: Revalidate source tree
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask check

      - name: Push source-only fix
        shell: bash
        run: |
          set -euo pipefail
          git add \
            services/rootd/src/main.rs \
            services/initd/src/main.rs \
            services/runtimed/src/spawn.rs \
            services/loaderd/src/main.rs \
            services/vfsd/src/main.rs
          git diff --cached --check
          git config user.name "ierwarf"
          git config user.email "64543544+ierwarf@users.noreply.github.com"
          git commit -m "fix(loader): canonicalize spawn executable paths"
          git push origin HEAD:master
