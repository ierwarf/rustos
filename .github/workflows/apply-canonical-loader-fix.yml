name: Apply canonical loader spawn fix

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/apply-canonical-loader-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          clean: false

      - name: Apply canonical spawn-path contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/apply_canonical_loader_fix.py
          cargo fmt --all
          git diff --check

      - name: Validate source tree
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask check

      - name: Commit validated fix to master
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-canonical-loader-fix.yml
          git rm tools/ci/apply_canonical_loader_fix.py
          git add \
            .github/workflows/bench-run.yml \
            services/rootd/src/main.rs \
            services/initd/src/main.rs \
            services/runtimed/src/spawn.rs \
            services/loaderd/src/main.rs \
            services/vfsd/src/main.rs
          git diff --cached --check
          git config user.name "ierwarf"
          git config user.email "64543544+ierwarf@users.noreply.github.com"
          git commit -m "fix(loader): canonicalize spawn executable paths"
          git push origin HEAD:master
