name: SMP bench 30s probe

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/smp-bench-30s-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          clean: false

      - name: Patch benchmark timeout to SMP iteration bound
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/xtask/src/bench.rs')
          text = path.read_text()
          old = '''const fn benchmark_timeout_seconds(rustos_vcpus: u8, isolated: bool) -> u64 {
    if rustos_vcpus > 1 && isolated {
        90
    } else if rustos_vcpus > 1 || isolated {
        60
    } else {
        30
    }
}
'''
          new = '''const fn benchmark_timeout_seconds(rustos_vcpus: u8, isolated: bool) -> u64 {
    if rustos_vcpus > 1 {
        30
    } else if isolated {
        60
    } else {
        30
    }
}
'''
          if text.count(old) != 1:
              raise SystemExit('benchmark timeout function changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git diff --check

      - name: Verify host and cached DVM
        shell: bash
        run: |
          set -euo pipefail
          test -r /dev/kvm
          test -w /dev/kvm
          qemu-system-x86_64 --version | head -n 1
          cargo xtask verify-dvm

      - name: Run 8-vCPU benchmark probe
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/ci-bench/probe-30s
          set +e
          cargo xtask bench --rustos-vcpus 8 --baseline build/ci-bench/probe-30s/control-8.txt > build/ci-bench/probe-30s/run.log 2>&1
          rc=$?
          set -e
          echo "smp_bench_30s_exit=$rc"
          grep -E 'formal profile|verification|probe[[:space:]]+iters|ipcbench:|timeout|missing=|failed|FAILED|error|Error' build/ci-bench/probe-30s/run.log | tail -n 260 || true
          if [ "$rc" -ne 0 ]; then tail -n 220 build/ci-bench/probe-30s/run.log; fi
          exit "$rc"
