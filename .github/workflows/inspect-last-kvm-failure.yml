name: Inspect retained KVM failure

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/inspect-last-kvm-failure.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true

      - name: Print panic callsites
        shell: bash
        run: |
          set -euo pipefail
          echo '=== pager_vma owner site ==='
          nl -ba kernel/ps/src/multitask/pager_vma.rs | sed -n '1080,1145p'
          echo
          echo '=== process_table waiter site ==='
          nl -ba kernel/ps/src/multitask/process_table.rs | sed -n '410,465p'
          echo
          echo '=== process_state_lock panic site ==='
          nl -ba kernel/ps/src/multitask/process_state_lock.rs | sed -n '125,170p'
          echo
          echo '=== tlb nested panic site ==='
          nl -ba kernel/hal/src/arch/tlb_shootdown.rs | sed -n '490,535p'
