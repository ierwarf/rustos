name: Inspect retained KVM failure

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/inspect-last-kvm-failure.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false

      - name: Inspect retained 8-vCPU readiness tail
        shell: bash
        run: |
          set -uo pipefail
          echo '=== failure summary ==='
          cat build/kvm/failure-summary.json 2>/dev/null || true
          echo
          echo '=== UI / ipcbench / launch progression ==='
          grep -nE 'uiserver:|wayclick:|ipcbench:|runtimed:|sessiond:|initd:|inputd:|gpu-compositor|first frame|first-frame|spawn|activated|ready' build/kvm/rustos-debugcon.log 2>/dev/null | tail -n 1600 || true
          echo
          echo '=== last 500 structured RustOS records ==='
          tail -n 500 build/kvm/rustos-debugcon.log 2>/dev/null || true
          echo
          echo '=== DVM tail ==='
          tail -n 220 build/kvm/linux-dvm-serial.log 2>/dev/null || true
          echo
          echo '=== QEMU stderr tails ==='
          tail -n 120 build/kvm/rustos-qemu.stderr.log 2>/dev/null || true
          tail -n 120 build/kvm/linux-dvm-qemu.stderr.log 2>/dev/null || true
