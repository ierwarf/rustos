name: Ring3 component model

on:
  push:
    branches: [master, ring3-declarative-idl]
  pull_request:
    branches: [master, ring3-declarative-idl]

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install repository Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
      - name: Generate declarative Ring3 IDL
        run: |
          python3 tools/ring3_idl_codegen.py --write
          cargo fmt -p rustos-component-model
      - name: Save generated IDL in staging only
        if: github.ref == 'refs/heads/ring3-declarative-idl'
        run: |
          git add libs/rustos-component-model/src/lib.rs libs/rustos-component-model/src/generated_idl.rs
          if ! git diff --cached --quiet; then
            git config user.name "rustos-ring3-checks[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: synchronize generated control-plane IDL"
            git push origin HEAD:refs/heads/ring3-declarative-idl
          fi
      - name: Verify generated IDL is deterministic
        run: python3 tools/ring3_idl_codegen.py --check
      - name: Check component formatting
        run: |
          cargo fmt -p rustos-component-model -- --check
          rustfmt --edition 2021 --check services/rootd/src/component_policy.rs
      - name: Run component-model tests
        run: cargo test -p rustos-component-model --locked
      - name: Run rootd unit tests
        run: cargo test -p rootd --features host-test --locked
      - name: Check full RustOS build graph
        run: cargo xtask check
