name: Ring3 component model

on:
  push:
    branches: [master, ring3-service-route-manifest-20261031]
  pull_request:
    branches: [master, ring3-service-route-manifest-20261031]

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install repository Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
      - name: Verify declarative Ring3 IDL
        run: python3 tools/ring3_idl_codegen.py --check
      - name: Format staged service route sources
        run: |
          rustfmt --edition 2021 services/rootd/src/service_manifest.rs
          rustfmt --edition 2021 services/rootd/src/component_policy.rs
      - name: Save staged service route formatting
        if: github.ref == 'refs/heads/ring3-service-route-manifest-20261031'
        run: |
          git add services/rootd/src/service_manifest.rs services/rootd/src/component_policy.rs
          if ! git diff --cached --quiet; then
            git config user.name "rustos-ring3-checks[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format declarative rootd service routes"
            git push origin HEAD:refs/heads/ring3-service-route-manifest-20261031
          fi
      - name: Check staged service routing formatting
        run: |
          rustfmt --edition 2021 --check services/rootd/src/service_manifest.rs
          rustfmt --edition 2021 --check services/rootd/src/component_policy.rs
      - name: Check component formatting
        run: |
          cargo fmt -p rustos-component-model -- --check
          rustfmt --edition 2021 --check services/rootd/src/component_policy.rs
      - name: Run component-model tests
        run: cargo test -p rustos-component-model --locked
      - name: Run rootd unit tests
        run: cargo test -p rootd --features host-test --locked
      - name: Check full RustOS build graph
        run: cargo xtask check
