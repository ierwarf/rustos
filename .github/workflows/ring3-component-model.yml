name: Ring3 component model

on:
  push:
    branches: [master, ring3-staged-integration]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install repository Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
      - name: Check component formatting
        run: cargo fmt -p rustos-component-model -- --check
      - name: Run component-model tests
        run: cargo test -p rustos-component-model --locked
      - name: Run rootd unit tests
        run: cargo test -p rootd --features host-test --locked
