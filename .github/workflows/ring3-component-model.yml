name: Ring3 component model

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install repository Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
      - name: Verify declarative Ring3 IDL
        run: python3 tools/ring3_idl_codegen.py --check
      - name: Verify checkpoint and role formatting
        run: |
          rustfmt --edition 2021 --check services/rootd/src/service_checkpoint.rs
          rustfmt --edition 2021 --check services/rootd/src/service_manifest.rs
          rustfmt --edition 2021 --check services/rootd/src/component_policy.rs
      - name: Check component formatting
        run: cargo fmt -p rustos-component-model -- --check
      - name: Run component-model tests
        run: cargo test -p rustos-component-model --locked
      - name: Run rootd unit tests
        run: cargo test -p rootd --features host-test --locked
      - name: Run runtimed host tests
        run: cargo test -p runtimed --locked
      - name: Check full RustOS build graph
        run: cargo xtask check

  prune-integrated-branches:
    # The one-time marker ensures a later ordinary master push cannot prune
    # independently created branches. Every tip is already a merge parent.
    if: >-
      github.repository == 'ierwarf/rustos' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.event.head_commit.message == 'chore(ring3): consolidate remaining branches and harden service revocation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete merged remote heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            chatgpt-recover-34815292339
            codex/optimize-ipc-scheduler-paging
            docs/reconcile-markdown-20261031
            ring3-ancestor-liveness-fix
            ring3-checkpoint-bounded-storage
            ring3-declarative-idl
            ring3-integration-scratch
            ring3-lease-admission-hardening
            ring3-nested-manifest-activation-20261031
            ring3-recovery-graph-hardening
            ring3-runtimed-session-capacity
            ring3-service-route-manifest-20261031
            ring3-session-route-epoch
            ring3-staged-integration
          )
          for branch in "${branches[@]}"; do
            ref="repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            if gh api "${ref}" >/dev/null 2>&1; then
              gh api -X DELETE "${ref}"
            fi
          done
