name: Rebuild DVM and probe 8-vCPU

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/rebuild-dvm-and-probe-8vcpu.yml"

permissions:
  contents: read

concurrency:
  group: rustos-dvm-rebuild-probe
  cancel-in-progress: true

jobs:
  rebuild-probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          clean: false

      - name: Host and cache preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)"
          id
          test -r /dev/kvm
          test -w /dev/kvm
          qemu-system-x86_64 --version | head -n 1
          for cmd in make gcc g++ patch perl python3 rsync cpio unzip bc curl bsdtar file tar; do
            command -v "$cmd" || true
          done
          echo '=== persistent compiler caches ==='
          du -sh "$HOME/.buildroot-ccache" "$HOME/.ccache" 2>/dev/null || true
          find "$HOME" -maxdepth 2 -type d \( -name '*ccache*' -o -name '.cache' \) -print 2>/dev/null | head -n 40 || true
          echo '=== libelf ==='
          ls -l /usr/include/libelf.h /usr/include/gelf.h /usr/lib/libelf.so 2>/dev/null || true

      - name: Bootstrap small host tools if needed
        shell: bash
        run: |
          set -euo pipefail
          toolroot="$RUNNER_TEMP/rustos-host-tools"
          mkdir -p "$toolroot"
          bootstrap_pkg() {
            pkg="$1"; cmd="$2"
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "$cmd=system"
              return 0
            fi
            mapfile -t urls < <(pacman -Sp --print-format '%l' "$pkg")
            test "${#urls[@]}" -gt 0
            for url in "${urls[@]}"; do
              archive="$RUNNER_TEMP/$(basename "$url")"
              curl --fail --location --silent --show-error "$url" -o "$archive"
              bsdtar -xf "$archive" -C "$toolroot"
            done
            export PATH="$toolroot/usr/bin:$PATH"
            command -v "$cmd"
          }
          bootstrap_pkg bc bc
          bootstrap_pkg rsync rsync
          bootstrap_pkg cpio cpio
          bootstrap_pkg unzip unzip
          echo "$toolroot/usr/bin" >> "$GITHUB_PATH"

      - name: Rebuild Linux DVM bundle
        shell: bash
        run: |
          set -uo pipefail
          start=$(date +%s)
          set +e
          cargo xtask build-dvm > /tmp/rustos-dvm-rebuild.log 2>&1
          rc=$?
          set -e
          end=$(date +%s)
          echo "dvm_rebuild_exit=$rc elapsed_seconds=$((end-start))"
          tail -n 240 /tmp/rustos-dvm-rebuild.log
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          cargo xtask verify-dvm
          make -C driver-domains/linux ccache-stats || true

      - name: Probe fixed tree at 8 vCPU
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/ci-bench/fault-fix-probe
          set +e
          cargo xtask bench --rustos-vcpus 8 \
            --baseline build/ci-bench/fault-fix-probe/control-8.txt \
            > build/ci-bench/fault-fix-probe/run.log 2>&1
          rc=$?
          set -e
          echo "probe_8vcpu_exit=$rc"
          awk '/^probe[[:space:]]+iters/{show=1} show{print}' build/ci-bench/fault-fix-probe/run.log | tail -n 300 || true
          if [ "$rc" -ne 0 ]; then
            echo '=== benchmark tail ==='
            tail -n 220 build/ci-bench/fault-fix-probe/run.log
            echo '=== panic/readiness evidence ==='
            grep -nE '\[PANIC\]|NESTED PANIC|ProcessStateLock|uiserver:|ipcbench:|wayclick:|dvm-input-policy-ready' build/kvm/rustos-debugcon.log 2>/dev/null | tail -n 600 || true
            echo '=== failure summary ==='
            cat build/kvm/failure-summary.json 2>/dev/null || true
          fi
          exit "$rc"
