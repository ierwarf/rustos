name: Formal nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  formal-nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Cache formal toolchains
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/bin/cargo-kani
          ~/.cargo/bin/kani
          ~/.kani
          ~/.cache/rustos/tla
          ~/.cache/rustos/verus
          ~/.cache/rustos/apalache
          ~/.cache/rustos/tlaps
          ~/.cache/miri
          ~/.cargo/bin/cargo-fuzz
          ~/.cargo/registry
        key: ${{ runner.os }}-formal-nightly-${{ hashFiles('formal/tla2tools.lock', 'formal/kani.lock', 'formal/verus.lock', 'formal/apalache.lock', 'formal/tlaps.lock', 'formal/fuzz.lock', 'formal/models.tsv', 'rust-toolchain.toml') }}
        restore-keys: |
          ${{ runner.os }}-formal-nightly-
          ${{ runner.os }}-formal-
    - name: Install Java for TLC
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        distribution: temurin
        java-version: "17"
    - name: Install pinned formal tools
      run: |
        bash formal/setup-kani.sh
        bash formal/setup-verus.sh
        bash formal/setup-miri.sh
        bash formal/setup-fuzz.sh
        bash formal/setup-apalache.sh
        bash formal/setup-tlaps.sh
    - name: Run deterministic and randomized formal gates
      run: bash formal/verify-all.sh --profile nightly
    - name: Upload formal evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: formal-nightly-evidence
        path: build/formal
        if-no-files-found: error
        retention-days: 30
    - name: File or update an issue on nightly failure
      # Nothing merge-blocking depends on this workflow, so a red run is
      # otherwise silent unless someone happens to check the Actions tab.
      # Reuse one open tracking issue instead of filing a new one per night.
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        title="[formal-nightly] gate is failing"
        existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
          --search "in:title \"$title\"" --json number --jq '.[0].number')"
        body="Scheduled \`formal/verify-all.sh --profile nightly\` failed. Run: $RUN_URL"
        if [[ -n "$existing" ]]; then
          gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
        else
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
        fi
