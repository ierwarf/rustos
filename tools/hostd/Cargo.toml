[package]
name = "rustos-hostd"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
driver-domain-protocol = { path = "../../libs/driver-domain-protocol" }
ed25519-dalek = "2"
rustos-driver-domain-host = { path = "../../libs/driver-domain-host" }
serde_json = "1"
sha2 = "0.10"
