[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
fatfs = { git = "https://github.com/rafalh/rust-fatfs", default-features = false, features = ["std", "lfn"] }
fs-err = "3"
rustos-fault-injection = { path = "../../libs/rustos-fault-injection" }
rustos-driver-domain-host = { path = "../../libs/driver-domain-host" }
rustos-image-admission = { path = "../../libs/rustos-image-admission" }
driver-domain-protocol = { path = "../../libs/driver-domain-protocol" }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
storage-core = { path = "../../libs/storage-core" }
storage-fat = { path = "../../libs/storage-fat" }
tempfile = "3"
toml = "0.8"
walkdir = "2"
