[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
fatfs = { git = "https://github.com/rafalh/rust-fatfs", default-features = false, features = ["std", "lfn"] }
serde = { version = "1.0", features = ["derive"] }
storage-core = { path = "../../libs/storage-core" }
storage-fat = { path = "../../libs/storage-fat" }
toml = "0.8"
xshell = "0.2"
