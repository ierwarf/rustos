[package]
name = "runtime-control"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
rustos-user-abi = { path = "../rustos-user-abi" }
session-profile = { path = "../session-profile" }

[lints.rust]
