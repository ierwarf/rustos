project_name: "rustos"
languages:
  - rust
  - cpp
encoding: "utf-8"
ignore_all_files_in_gitignore: true
ignored_paths:
  - "build/**"
  - "target/**"
  - "logs/**"
  - "vendor/**"
  - "Cargo.lock"
  - "perf.data"
read_only: false
initial_prompt: "Follow AGENTS.md; all other repo docs are on demand. Keep context small and prefer focused Serena symbol/reference operations once useful; ordinary editing remains allowed when smaller. Resume via docs/ai/session-handoff.md and preserve dirty work."
ls_workspace_folders:
  - .
