[package]
name = "pagerd"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
rustos-svc-runtime = { path = "../../libs/rustos-svc-runtime" }
rustos-user-abi = { path = "../../libs/rustos-user-abi" }
rustos-library-cache-policy = { path = "../../libs/rustos-library-cache-policy" }
sha2 = { version = "0.10", default-features = false }

[[bin]]
name = "pagerd"
path = "src/main.rs"
test = false

