id = "sessiond"
kind = "service"
execution_domain = "user"
profiles = ["default"]
startup = "none"

[build]
builder = "cargo-kernel-binary"
package = "sessiond"

[install]
path = "services/sessiond/sessiond.elf"

[[desktop.entries]]
display_name = "sessiond"
weight_micros = 100
logical_admin = true
console_hosted = false
