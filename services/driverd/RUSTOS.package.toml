id = "driverd"
kind = "service"
execution_domain = "user"
profiles = ["default"]
startup = "init"

[build]
builder = "cargo-kernel-binary"
package = "driverd"

[install]
path = "services/driverd/driverd.elf"

[[desktop.entries]]
display_name = "driverd"
weight_micros = 100
logical_admin = true
console_hosted = false
