id = "loaderd"
kind = "service"
execution_domain = "user"
startup = "none"

[build]
builder = "cargo-kernel-binary"
package = "loaderd"
linkage = "static-pie"

[install]
path = "services/loaderd/loaderd.elf"

[[desktop.entries]]
display_name = "loaderd"
weight_micros = 100
logical_admin = true
console_hosted = false
