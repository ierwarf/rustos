[package]
name = "loaderd"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "loaderd"
path = "src/main.rs"
test = false

[dependencies]
rustos-svc-runtime = { path = "../../libs/rustos-svc-runtime" }
rustos-user-abi = { path = "../../libs/rustos-user-abi" }
rustos-image-admission = { path = "../../libs/rustos-image-admission" }

rustos-release-verifier = { path = "../../libs/rustos-release-verifier" }
rustos-component-model = { path = "../../libs/rustos-component-model" }
