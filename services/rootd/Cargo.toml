[package]
name = "rootd"
version = "0.1.0"
edition = "2021"
publish = false

build = "build.rs"

[features]
# Enables a native Cargo test harness.  The production service is a
# freestanding ELF whose linker entrypoint is supplied by build.rs.
host-test = []

[dependencies]
rustos-svc-runtime = { path = "../../libs/rustos-svc-runtime" }
rustos-user-abi = { path = "../../libs/rustos-user-abi" }
