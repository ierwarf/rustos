id = "vfsd"
kind = "service"
execution_domain = "user"
startup = "none"

[build]
builder = "cargo-kernel-binary"
package = "vfsd"
linkage = "static-pie"

[install]
path = "services/vfsd/vfsd.elf"

[[desktop.entries]]
display_name = "vfsd"
weight_micros = 100
logical_admin = true
console_hosted = false
