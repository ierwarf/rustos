id = "runtimed"
kind = "service"
execution_domain = "user"
profiles = ["default"]
startup = "init"

[build]
builder = "cargo-kernel-binary"
package = "runtimed"

[install]
path = "services/runtimed/runtimed.elf"

[boot]
preload = true
required = false
priority = -577

[[desktop.entries]]
display_name = "runtimed"
weight_micros = 100
logical_admin = true
console_hosted = false
