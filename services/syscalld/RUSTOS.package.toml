id = "syscalld"
kind = "service"
execution_domain = "user"
startup = "none"

[build]
builder = "cargo-kernel-binary"
package = "syscalld"
linkage = "static-pie"

[install]
path = "services/syscalld/syscalld.elf"

[[desktop.entries]]
display_name = "syscalld"
weight_micros = 100
logical_admin = true
console_hosted = false
