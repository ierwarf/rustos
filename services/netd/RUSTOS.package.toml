id = "netd"
kind = "service"
execution_domain = "user"
profiles = ["default"]
startup = "init"

[build]
builder = "cargo-kernel-binary"
package = "netd"

[install]
path = "services/netd/netd.elf"

[boot]
preload = true
required = false
priority = -588

[[desktop.entries]]
display_name = "netd"
weight_micros = 50
logical_admin = true
console_hosted = false
