id = "procd"
kind = "service"
execution_domain = "user"
startup = "none"

[build]
builder = "cargo-kernel-binary"
package = "procd"
linkage = "static-pie"

[install]
path = "services/procd/procd.elf"

[[desktop.entries]]
display_name = "procd"
weight_micros = 100
logical_admin = true
console_hosted = false
