id = "uiserver"
kind = "service"
execution_domain = "user"
profiles = ["default"]
startup = "desktop"

[build]
builder = "cargo-kernel-binary"
package = "uiserver"

[install]
path = "services/uiserver/uiserver.elf"

[[desktop.entries]]
display_name = "UI Server"
weight_micros = 2000
logical_admin = false
console_hosted = false
