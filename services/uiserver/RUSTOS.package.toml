id = "uiserver"
kind = "service"
execution_domain = "user"
profiles = ["default"]
startup = "desktop"

[build]
builder = "cargo-kernel-binary"
package = "uiserver"

[install]
path = "services/uiserver/uiserver.elf"

[[desktop.entries]]
display_name = "UI Server"
weight_micros = 2000
logical_admin = false
console_hosted = false
# KVM validation flips only the private runtime-disk copy from `0` to `1`.
# Release images keep the profiler disabled without a separate binary.
env = ["RUSTOS_UI_PROFILE=0"]
