# Project-scoped Codex configuration for RustOS.
#
# Loaded in addition to ~/.codex/config.toml when the agent is run with
# CWD inside this repo. Only applies because this project is marked
# trust_level = "trusted" in the user config.
#
# Keep this file project-specific: hooks, MCP servers, and any
# overrides that only make sense for RustOS work belong here. Personal
# style settings (model, reasoning effort, plugins, memories) stay in
# the user config.

web_search = "live"
model_verbosity = "medium"
sandbox_mode = "workspace-write"
[features]
hooks = true

# This is the canonical Codex hook representation for the project. Claude
# Code-specific hooks live in .claude/settings.json and must not be duplicated
# under .codex/.
[[hooks.PreToolUse]]
matcher = "^(Read|mcp__.*read.*file|mcp__serena__read_file)$"
[[hooks.PreToolUse.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/.codex/hooks/pre_read_large_file.sh"'
timeout = 3
statusMessage = "Checking read bound"

[[hooks.PreToolUse]]
matcher = "^(apply_patch|Edit|Write|mcp__serena__(create_text_file|insert_after_symbol|insert_before_symbol|rename_symbol|replace_content|replace_in_files|replace_symbol_body|safe_delete_symbol))$"
[[hooks.PreToolUse.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/.codex/hooks/pre_edit_policy.sh"'
timeout = 3
statusMessage = "Checking edit policy"

# One shell hook owns both destructive-command protection and commit-only
# gates. A harmless shell call therefore pays for one hook process, not two.
[[hooks.PreToolUse]]
matcher = "^(Bash|exec_command|mcp__serena__execute_shell_command)$"
[[hooks.PreToolUse.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/.codex/hooks/pre_bash_destructive.sh"'
timeout = 110
statusMessage = "Checking shell policy"

[[hooks.PostToolUse]]
matcher = "^(apply_patch|Edit|Write|mcp__serena__(create_text_file|insert_after_symbol|insert_before_symbol|rename_symbol|replace_content|replace_in_files|replace_symbol_body|safe_delete_symbol))$"
[[hooks.PostToolUse.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/.agents/hooks/post_edit_rust.sh"'
timeout = 75
statusMessage = "Checking Rust edit"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/.codex/hooks/user_prompt_policy.sh"'
timeout = 3
statusMessage = "Checking prompt safety"

[[hooks.SessionStart]]
matcher = "^(startup|resume)$"
[[hooks.SessionStart.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/.codex/hooks/session_context.sh"'
timeout = 3
statusMessage = "Loading RustOS context"

# MCP servers are exact-version project inputs installed by
# tools/agent/bootstrap-remote-ai-tools.sh. They resolve from PATH so a checkout
# is portable across workstations and self-hosted runners.
#   ripgrep   — mcp-ripgrep 0.4.0
#   serena    — serena-agent==1.6.0
#   ast-grep  — ast-grep CLI 0.45.2 + sg-mcp commit 149e20d47bb7125fb0c1451feea2f48a98742034
#   codegraph — @astudioplus/codegraph-mcp 0.20.1

[mcp_servers.ripgrep]
command = "npx"
args = ["-y", "mcp-ripgrep@0.4.0"]
[mcp_servers.ripgrep.tools.search]
approval_mode = "approve"

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server"]

[mcp_servers.ast_grep]
command = "ast-grep-server"
args = []

[mcp_servers.codegraph]
command = "codegraph-mcp"
args = ["--mcp", "--exclude", "target", "--exclude", "build", "--exclude", "logs", "--exclude", "vendor", "--exclude", "driver-domains/linux/out", "--exclude", "Cargo.lock", "--max-files", "20000", "--profile", "all", "--graph-only"]

[sandbox_workspace_write]
network_access = true
