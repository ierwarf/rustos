[package]
name = "rustos-loom-proof-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

# Optimize exhaustive exploration, not its bounds; retain all debug guards.
[profile.dev]
opt-level = 2
debug-assertions = true
overflow-checks = true

[dev-dependencies]
loom = "=0.7.2"
rustos-scheduler-frame-gate = { path = "../../libs/rustos-scheduler-frame-gate" }
