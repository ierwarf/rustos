# Each entry is a bounded, source-anchored concurrency claim.  Loom and
# Shuttle are required for every entry; herd7 is required only when the
# concrete source transition publishes data through a lock-free atomic edge.
# A non-applicable herd7 verdict must name why an ISA litmus would model the
# wrong abstraction instead of silently leaving a coverage gap.
schema = "rustos-concurrency-triangle-v1"

[budget]
loom_max_branches = 200
shuttle_iterations = 128
shuttle_pct_depth = 3
shuttle_max_seconds = 30
herd_max_seconds = 10

