# Each entry is a bounded, source-anchored concurrency claim.  Loom and
# Shuttle are required for every entry; herd7 is required only when the
# concrete source transition publishes data through a lock-free atomic edge.
# A non-applicable herd7 verdict must name why an ISA litmus would model the
# wrong abstraction instead of silently leaving a coverage gap.
schema = "rustos-concurrency-triangle-v1"

[budget]
loom_max_branches = 200
shuttle_iterations = 128
shuttle_pct_depth = 3
shuttle_max_seconds = 30
herd_max_seconds = 10

[[scenario]]
id = "endpoint-publication"
severity = "critical"
flow = "endpoint-lifecycle"
model = "endpoint-publication/EndpointPublication"
source = "kernel/compat/src/user/syscall/linux/ipc_ops.rs"
source_symbol = "cleanup_service_endpoints_for_process"
source_anchors = ["cleanup_service_endpoints_for_process"]
invariant = "exit revocation and endpoint publication have one lock-protected terminal owner"
loom_test = "exit_and_publication_never_leave_authority_live"
shuttle_test = "endpoint_exit_and_publication_have_one_terminal_owner"
herd_not_applicable = "the decisive edge is a mutex-protected ownership transition, not an ISA-visible lock-free publication"

[[scenario]]
id = "futex-wait-linearization"
severity = "critical"
flow = "futex-wait-lifecycle"
model = "futex-waiter-lifecycle/FutexWaiterLifecycle"
source = "kernel/compat/src/user/syscall/linux/service_ops/futex_thread.rs"
source_symbol = "futex_wait"
source_anchors = [
  "let mut waiters = FUTEX_WAITERS.lock();",
  ".atomic_load_user_u32(uaddr)",
  "register_futex_waiter_in(",
]
invariant = "FUTEX_WAIT comparison and waiter publication share one bucket transaction that a store plus WAKE cannot pass"
loom_test = "futex_compare_and_waiter_publication_have_one_linearization_point"
shuttle_test = "futex_store_wake_cannot_pass_compare_and_queue_publication"
herd_not_applicable = "the decisive property spans a userspace store, a syscall boundary, and lock-protected waiter ownership; an ISA-only litmus would omit the queue transaction"

[[scenario]]
id = "ipc-priority-lane"
severity = "critical"
flow = "scheduler-dispatch"
model = "ipc-priority-queue/IpcPriorityQueue"
source = "kernel/ipc-runtime/src/ipc/endpoint_priority.rs"
source_symbol = "next_pending"
source_anchors = [
  "!self.pending_system_messages.is_empty()",
  "self.consecutive_system_deliveries",
]
invariant = "one endpoint slot guard preserves both lane FIFOs and reserves an ordinary head after two System deliveries"
loom_test = "ipc_priority_lane_is_kernel_derived_and_starvation_bounded"
shuttle_test = "ipc_priority_lane_remains_fifo_and_burst_bounded"
herd_not_applicable = "lane selection and both queue mutations are protected by one tracked endpoint slot lock; an ISA litmus would omit the queue and trusted scheduler-class boundary"

[[scenario]]
id = "ipc-terminal-owner"
severity = "critical"
flow = "ipc-call"
model = "ipc-reply-deadline/IpcReplyDeadline"
source = "kernel/ipc-runtime/src/ipc/mod.rs"
source_symbol = "cancel_endpoint_calls_for_task"
source_anchors = ["cancel_endpoint_calls_for_task"]
invariant = "reply, timeout, and revoke leave at most one terminal owner for each call"
loom_test = "ipc_retirement_accepts_exact_global_capacity"
shuttle_test = "ipc_reply_timeout_and_revoke_have_one_terminal_owner"
herd_not_applicable = "the property is a lock-protected terminal-state race; a register-level litmus would omit call identity and cancellation ownership"

[[scenario]]
id = "pager-fault-frame-reserve"
severity = "high"
flow = "pager-frame-grant-lifecycle"
model = "pager-frame-grant-lifecycle/PagerFrameGrantLifecycle"
source = "kernel/mm/src/memory/frame_capability.rs"
source_symbol = "reserve"
source_anchors = [
  "|available| available.checked_sub(1),",
  "let frame_phys = self.frames[index].swap(0, Ordering::AcqRel);",
]
invariant = "the availability count authorizes exactly one claimer per frame and a granted claim always finds one"
loom_test = "two_claimers_never_receive_the_same_reserve_frame"
shuttle_test = "fault_reserve_claims_are_exclusive_and_never_promise_a_missing_frame"
herd_not_applicable = "the decisive edge is a single-location locked read-modify-write; x86 guarantees its atomicity by construction, so a litmus has no forbidden interleaving to exhibit and would model the array scan rather than the claim"

[[scenario]]
id = "pager-fault-install-permit"
severity = "critical"
flow = "pager-vma-publication"
model = "pager-vma-publication/PagerVmaPublication"
source = "kernel/ps/src/multitask/pager_vma.rs"
source_symbol = "publish"
source_anchors = [
  "self.sequence.store(before + 1, Ordering::Release);",
  "core::sync::atomic::fence(Ordering::SeqCst);",
]
invariant = "a withdrawing VMA writer never owns a prepared leaf an exception-time installer still holds a permit for"
loom_test = "a_withdrawing_writer_never_owns_a_leaf_an_installer_still_holds"
shuttle_test = "pager_vma_withdrawal_never_overlaps_a_held_fault_install_permit"
herd_test = "formal/litmus/x86_64/pager_fault_install_permit.litmus"
herd_mutant = "formal/litmus/x86_64/pager_fault_install_permit.mutant.litmus"
herd_cat = "x86tso-mixed.cat"

[[scenario]]
id = "pager-fault-table-install"
severity = "critical"
flow = "memory-map"
model = "page-table-map-transaction/PageTableMapTransaction"
source = "kernel/mm/src/memory/address_space/pager_fault_mapping.rs"
source_symbol = "publish_user_table_entry"
source_anchors = [
  "match entry.compare_exchange(0, desired, Ordering::AcqRel, Ordering::Acquire) {",
  "let observed = entry.load(Ordering::Acquire);",
]
invariant = "exactly one installer publishes an absent directory entry, and every CPU that observes it also observes the zeroed table it names"
loom_test = "only_one_installer_publishes_a_table_and_its_zeroing_is_never_missed"
shuttle_test = "table_publication_is_exclusive_and_every_loser_returns_its_frame"
herd_not_applicable = "the required edge is store-store - the zeroed table before the entry naming it - and x86-TSO forbids that reordering unconditionally, so a mutant litmus cannot reach the forbidden state and would be rejected as vacuous by the herd gate itself"

[[scenario]]
id = "reschedule-ipi"
severity = "critical"
flow = "smp-reschedule-ipi-lifecycle"
model = "smp-reschedule-ipi/SmpRescheduleIpi"
source = "kernel/ps/src/multitask/reschedule_observation.rs"
source_symbol = "publish_request"
source_anchors = [
  "let next = (sequence << 1) | PENDING_BIT;",
  "let claimed = current & !PENDING_BIT;",
]
invariant = "a coalesced durable request is pending or exactly consumed at the target safe point"
loom_test = "reschedule_request_is_never_lost_across_concurrent_consume"
shuttle_test = "reschedule_request_is_never_lost_across_target_consume"
herd_test = "formal/litmus/x86_64/reschedule_request_publication.litmus"
herd_mutant = "formal/litmus/x86_64/reschedule_request_publication.mutant.litmus"
herd_cat = "x86tso-mixed.cat"

[[scenario]]
id = "scheduler-transition-publication"
severity = "critical"
flow = "scheduler-cpu-ownership"
model = "scheduler-cpu-ownership/SchedulerCpuOwnership"
source = "kernel/ps/src/multitask/cpu_local.rs"
source_symbol = "drop"
source_anchors = [
  "TRANSITION_FROM_SLOTS[self.logical_index].store(self.original_task, Ordering::Release)",
  "TRANSITION_ACTIVE[self.logical_index].store(true, Ordering::Release)",
  "CURRENT_TASK_SLOTS[self.logical_index].store(selected_task, Ordering::Release)",
  "TRANSITION_ACTIVE[logical_index].store(false, Ordering::Release)",
]
invariant = "an observed incoming current or active pre-commit phase retains the exact outgoing stack slot; active may clear only at assembly commit"
loom_test = "scheduler_transition_publication_never_loses_outgoing_stack_owner"
shuttle_test = "scheduler_switch_never_exposes_incoming_without_outgoing_owner"
herd_test = "formal/litmus/x86_64/scheduler_transition_publication.litmus"
herd_mutant = "formal/litmus/x86_64/scheduler_transition_publication.mutant.litmus"
herd_cat = "x86tso-mixed.cat"

[[scenario]]
id = "scheduler-transition-wake-owner"
severity = "critical"
flow = "scheduler-cpu-ownership"
model = "scheduler-cpu-ownership/SchedulerCpuOwnership"
source = "kernel/ps/src/multitask/scheduler.rs"
source_symbol = "wake_task_slot"
source_anchors = [
  "TaskExecutionOwner::Transition(transition_cpu)",
  "match self.publish_runqueue_wake_to(slot, transition_cpu)",
  "context.test_ready = true;",
]
invariant = "a blocked transition wake publishes one durable target mailbox owner before the test adapter changes, cannot dispatch before assembly commit, and is claimed at most once after commit"
loom_test = "scheduler_transition_wake_has_one_queued_owner_until_commit"
shuttle_test = "scheduler_transition_wake_has_one_mailbox_owner_until_commit"
herd_not_applicable = "the decisive property composes assembly transition state, an owner-word CAS, and a lock-protected mailbox drain; the atomic transition publication already has a separate x86_64 litmus, while an ISA-only wake litmus would omit queue identity and one-shot dispatch"

[[scenario]]
id = "smp-qualification-deferred-bind"
severity = "critical"
flow = "deferred-process-activation"
model = "deferred-process-activation/DeferredProcessActivation"
source = "kernel/compat/src/user/syscall/linux/proc_broker_ops.rs"
source_symbol = "syscall_linux_rustos_proc_activate_broker"
source_anchors = [
  "let activations = DEFERRED_ACTIVATIONS.lock();",
  "prepare_smp_qualification_activation(",
  "multitask::activate_suspended_user_tasks_with_commit(",
]
invariant = "the kernel-derived qualification-required deferred authority reaches runnable state only through BoundSuspended then Active under the shared ProcBroker transaction; a late bind and batch activation both fail closed, while ordinary activation has no SESSIOND dependency"
loom_test = "smp_qualification_required_deferred_bind_serializes_activation"
shuttle_test = "smp_qualification_required_deferred_bind_serializes_activation"
herd_not_applicable = "the decisive edge is a lock-protected one-shot authority transaction spanning bind callbacks and scheduler publication; an ISA-only litmus cannot represent required-child or batch eligibility policy"

[[scenario]]
id = "smp-qualification-phase-revalidation"
severity = "critical"
flow = "smp-ring3-qualification"
model = "smp-ring3-qualification/SmpRing3Qualification"
source = "kernel/compat/src/user/syscall/linux/debug_ops.rs"
source_symbol = "syscall_linux_rustos_product_milestone"
source_anchors = [
  "match admit_smp_qualification_milestone(milestone, arg0, arg1, current_cpu)",
  "debug::record_milestone(debug::LogCategory::Compat, name, arg0, recorded_arg1);",
]
invariant = "after phase admission, evidence may publish only if the post-admission compound SESSIOND owner identity and endpoint epoch still match; revoke or re-register terminalizes the binding and emits no evidence"
loom_test = "smp_qualification_phase_revalidation_terminalizes_on_sessiond_epoch_change"
shuttle_test = "smp_qualification_phase_revalidation_terminalizes_on_sessiond_epoch_change"
herd_not_applicable = "the decisive edge spans endpoint owner identity, endpoint epoch, a lock-protected qualification FSM, and debug emission; reducing it to raw loads would omit terminalization and output suppression"

[[scenario]]
id = "tlb-ack-reclaim"
severity = "critical"
flow = "tlb-shootdown-lifecycle"
model = "tlb-shootdown-lifecycle/TlbShootdownLifecycle"
source = "kernel/hal/src/arch/tlb_shootdown.rs"
source_symbol = "on_interrupt"
source_anchors = [
  "ACK_GENERATION[logical_index].store(generation, Ordering::Release)",
  "ACK_GENERATION[target].load(Ordering::Acquire) == generation",
]
invariant = "an exact acknowledgement publishes a completed flush before reclaim"
loom_test = "tlb_mailbox_and_ack_publish_the_exact_generation"
shuttle_test = "tlb_mailbox_flush_ack_and_reclaim_preserve_generation_order"
herd_test = "formal/litmus/x86_64/tlb_ack_reclaim_publication.litmus"
herd_mutant = "formal/litmus/x86_64/tlb_ack_reclaim_publication.mutant.litmus"
herd_cat = "x86tso-mixed.cat"

[[scenario]]
id = "tlb-mailbox-request"
severity = "critical"
flow = "tlb-shootdown-lifecycle"
model = "tlb-shootdown-lifecycle/TlbShootdownLifecycle"
source = "kernel/hal/src/arch/tlb_shootdown.rs"
source_symbol = "finish_shootdown"
source_anchors = [
  "REQUEST_ROOT[target].store(mutation_root, Ordering::Relaxed)",
  "REQUEST_GENERATION[target].store(generation, Ordering::Release)",
  "let generation = REQUEST_GENERATION[logical_index].load(Ordering::Acquire)",
]
invariant = "a request generation publishes its complete target mailbox before handler validation"
loom_test = "tlb_mailbox_and_ack_publish_the_exact_generation"
shuttle_test = "tlb_mailbox_flush_ack_and_reclaim_preserve_generation_order"
herd_test = "formal/litmus/x86_64/tlb_mailbox_request_publication.litmus"
herd_mutant = "formal/litmus/x86_64/tlb_mailbox_request_publication.mutant.litmus"
herd_cat = "x86tso-mixed.cat"

[[scenario]]
id = "waitset-arm"
severity = "critical"
flow = "waitset"
model = "userspace-wait-set/UserspaceWaitSet"
source = "kernel/compat/src/user/syscall/linux/service_ops/poll_epoll.rs"
source_symbol = "syscall_linux_epoll_wait"
source_anchors = ["syscall_linux_epoll_wait"]
invariant = "a readiness generation crossing the check-register-recheck window cannot strand an armed waiter"
loom_test = "readiness_change_cannot_be_lost_across_arm"
shuttle_test = "waitset_generation_crossing_arm_is_not_lost"
herd_not_applicable = "the property requires provider registration and generation identity; reducing it to raw loads/stores would create a misleading ISA-only claim"
