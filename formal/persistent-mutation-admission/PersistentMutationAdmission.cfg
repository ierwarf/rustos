CONSTANTS
    Mounts = {"root", "data"}
    Operations = {"write", "truncate", "create", "unlink"}
    VolatileOperations = {"mkdir-run", "unlink-run"}
    MaxEpoch = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AdmittedOnlyOnWritableMounts
    RootIsNeverMutated
    ReadOnlyDeviceAdmitsNothing
    EpochCountsOnlyAdmittedMutations
    VolatilePolicyNeverMutatesPersistentEpoch
