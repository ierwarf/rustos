CONSTANTS
    Tasks = {1, 2}
    Cpus = {"cpu0", "cpu1"}
    Kinds = {"call", "reply"}
    MaxHandoffBurst = 1

SPECIFICATION Spec

INVARIANTS
    HandoffBurstIsBounded
    TypeOK
    QueueBounded
    QueueHasNoDuplicates
    QueueRecordsWerePublished
    QueueRecordsBelongToTheirCpu
