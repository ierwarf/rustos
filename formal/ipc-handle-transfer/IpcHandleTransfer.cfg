CONSTANTS
    Descriptors = {1, 2}

INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT RegistryContainsExactlyLiveDescriptors
INVARIANT BatchTransferIsAllOrNothing
INVARIANT QueuedMessageHasExactlyOneRegistryBatch
INVARIANT ReceivedMessageHasExactlyOneRegistryBatch
INVARIANT InvalidReceiverOutputNeverInstallsDescriptors
INVARIANT TerminalDescriptorsCarryNoRegistryAuthority
INVARIANT CancelledMessageHasNoLiveDescriptor
