\* Five addresses is the smallest space in which every action is reachable: a
\* three-page region can be split, a second region can occupy the pager's last
\* slot so the split is refused, and freeing that second region lets the parked
\* retry finally settle. Four addresses leaves the refusal and retry paths
\* unexercised.
CONSTANTS
    Addresses = {1, 2, 3, 4, 5}
    MaxVmas = 3
    MaxRegions = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    FaultableIsAlwaysBackedByThePager
    PagerSurplusIsUnreachable
    Ring0TableWithinCapacity
    PagerTableWithinCapacity
    SplitGrowthIsBounded
    NoWithdrawalWithoutHeadroom
    DeniedSpansRaiseNoFault
