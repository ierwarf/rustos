CONSTANTS
    CoreServices = {"vfsd", "loaderd"}
    Pids = {1, 2, 3, 4}
    MaxAttempts = 2
    WaitDeadline = 2
    MaxTime = 4

INIT Init
NEXT Next

INVARIANT TypeOK
