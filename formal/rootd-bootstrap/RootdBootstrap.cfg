INVARIANT LifecycleBindingsAreConsistent
INVARIANT WaitPhaseMatchesBindings
INVARIANT WaitOutcomeRespectsDeadline
INVARIANT InitdWasAuthorized
INVARIANT InitdIsSingleShot
INVARIANT AllNonzeroIdsWereIssued
INVARIANT DistinctLivePids
