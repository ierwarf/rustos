[profiles.pr]
evidence_max_age_hours = 168
# Two-minute pre-QEMU contract: preserve the exact finite configurations for
# the critical multi-owner models below; do not silently lower a model depth.
# Broader model inventory remains a nightly qualification lane.
tlc_max_wall_seconds = 120
# Reuse only exact, recent pass evidence.  The validator binds the TLA/CFG,
# pinned TLC binary, deadlock policy, workers, fingerprint, and seed.
tlc_reuse_max_age_hours = 24
# Refresh an exact cache entry before it can expire while the remaining proof
# lanes run and the current-tree evidence manifest is sealed.
tlc_seal_reserve_seconds = 300
required_models = [
    "acceptance-profile-publication/AcceptanceProfilePublication",
    "atomic-process-activation-batch/AtomicProcessActivationBatch",
    "bootstrap-activation-handoff/BootstrapActivationHandoff",
    "cpu-affinity-observation/CpuAffinityObservation",
    "cpu-online-lifecycle/CpuOnlineLifecycle",
    "cpu-topology-admission/CpuTopologyAdmission",
    "cross-cpu-task-retirement/CrossCpuTaskRetirement",
    "endpoint-publication/EndpointPublication",
    "endpoint-receiver-wakeup/EndpointReceiverWakeup",
    "exec-address-space-transaction/ExecAddressSpaceTransaction",
    "futex-waiter-lifecycle/FutexWaiterLifecycle",
    "gpu-submit-transaction/GpuSubmitTransaction",
    "ipc-endpoint-ownership/IpcEndpointOwnership",
    "ipc-priority-inheritance/IpcPriorityInheritance",
    "ipc-priority-queue/IpcPriorityQueue",
    "ipc-reply-recv-transaction/IpcReplyRecvTransaction",
    "per-cpu-clockevent-lifecycle/PerCpuClockeventLifecycle",
    "process-address-space-lifetime/ProcessAddressSpaceLifetime",
    "product-boot/ProductBoot",
    "robust-futex-owner-death/RobustFutexOwnerDeath",
    "scheduler-cpu-ownership/SchedulerCpuOwnership",
    "smp-ring3-qualification/SmpRing3Qualification",
    "smp-release-admission/SmpReleaseAdmission",
    "smp-reschedule-ipi/SmpRescheduleIpi",
    "syscall-simd-lifecycle/SyscallSimdLifecycle",
    "task-affinity-lifecycle/TaskAffinityLifecycle",
    "tlb-shootdown-lifecycle/TlbShootdownLifecycle",
    "userspace-wait-set/UserspaceWaitSet",
    "userspace-wait-set/WaitSetRegistry",
    "user-stack-growth/UserStackGrowth",
]
required_evidence = [
    "build/formal/source-conformance/summary.json",
    "build/formal/smp-source-assumptions/summary.json",
    "build/formal/proof-index/summary.json",
    "build/formal/kani/summary.json",
    "build/formal/verus/summary.json",
    "build/formal/runtime-traces/runtime-control-rpc-summary.json",
    "build/formal/runtime-traces/kvm-p0-summary.json",
    "build/formal/fault-scenarios/summary.json",
    "build/formal/abi-differential/summary.json",
    "build/formal/recovery-scenarios/summary.json",
    "build/formal/implementation-mutations/summary.json",
    "build/formal/spec-mutations/summary.json",
    "build/formal/concurrency-triangle/summary.json",
]

