[topologies.qemu-commercial]
runtime_scenario = "interactive-boot"
hard_deadline_ms = 5000
required_runtime_models = [
    "rootd-bootstrap/RootdBootstrap",
    "dvm-block-startup/DvmBlockStartup",
    "input-ingestion-worker/InputIngestionWorker",
    "dvm-display-readiness/DvmDisplayReadiness",
    "product-boot/ProductBoot",
    "ui-frame-budget/UiFrameBudget",
]
required_artifacts = [
    "build/rustos-boot.img",
    "driver-domains/linux/out/artifacts/rustos-linux-dvm-x86_64.bzImage",
    "driver-domains/linux/out/artifacts/rustos-linux-dvm-x86_64.rootfs.cpio.zst",
]

[topologies.storage-dvm]
runtime_scenario = "storage-boot"
hard_deadline_ms = 5000
required_runtime_models = [
    "rootd-bootstrap/RootdBootstrap",
    "dvm-block-startup/DvmBlockStartup",
]
required_artifacts = [
    "build/rustos-boot.img",
    "driver-domains/linux/out/artifacts/rustos-linux-dvm-x86_64.bzImage",
    "driver-domains/linux/out/artifacts/rustos-linux-dvm-x86_64.rootfs.cpio.zst",
]

[topologies.qemu-control]
