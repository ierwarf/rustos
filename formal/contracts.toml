flows = ["input-delivery-lifecycle", "scheduler-dispatch"]
reason = "Inputd owns readiness publication, policy queue progress, transport consumer lifetime, and the first fused reply-receive service loop."

[[risk_surfaces]]
path = "services/inputd/src/service_loop.rs"
severity = "critical"
flows = ["scheduler-dispatch"]
reason = "The service loop owns byte-only reply-receive phase handling and must terminate every dequeued caller exactly once."

[[risk_surfaces]]
path = "services/netd/src/main.rs"
severity = "critical"
flows = ["dvm-network-ingress", "netd-deferred-reply-lifecycle"]
reason = "Netd owns packet admission, one-time absolute deadline tightening, and exact deferred socket reply settlement."

[[risk_surfaces]]
path = "services/runtimed/src/spawn.rs"
severity = "critical"
flows = ["scheduler-dispatch"]
reason = "Runtime launch policy is the only user-space admission path into strict scheduling class."

[[risk_surfaces]]
path = "services/runtimed/src/socket.rs"
severity = "critical"
flows = ["runtime-control-ingress"]
reason = "Runtime control peers can mutate process and desktop lifecycle."

[[risk_surfaces]]
path = "services/uiserver/src/wayland.rs"
severity = "critical"
flows = ["wayland-client-ingress"]
reason = "Untrusted Wayland objects, buffers, callbacks, and disconnects share compositor state."

[[risk_surfaces]]
path = "services/uiserver/src/wayland_accept.rs"
severity = "critical"
flows = ["wayland-client-ingress"]
reason = "Listener readiness, accepted-stream ownership, and UI wake ordering admit untrusted Wayland peers."

[[risk_surfaces]]
path = "services/uiserver/src/gpu_runtime.rs"
severity = "critical"
flows = ["dvm-display-ingress", "gpu-frame-lifecycle"]
reason = "Frame submission, completion, timeout, and provider revoke directly affect interactive availability."

[[risk_surfaces]]
path = "kernel/compat/src/user/syscall/linux/device_broker_ops.rs"
severity = "critical"
flows = ["commercial-envelope", "service-call-authority"]
reason = "Device handles and ioctl routes cross from service policy into ring0 capability installation."

[[risk_surfaces]]
path = "kernel/ps/src/user/memfd.rs"
severity = "critical"
flows = ["memory-map", "physical-frame-lifecycle", "vfs-open-description"]
reason = "Memfd seals, shared frames, cursors, and mapping counts cross descriptor and address-space lifetimes."

[[risk_surfaces]]
path = "services/devmgrd/src/main.rs"
severity = "critical"
flows = ["commercial-envelope", "service-call-authority"]
reason = "Device discovery and delegated ioctl policy can mint kernel capabilities and must remain bounded and owner-authenticated."

