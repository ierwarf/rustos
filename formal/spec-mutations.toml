[[mutation]]
id = "cpu-online-restart-fails-open"
kind = "transition-effect"
severity = "critical"
model = "cpu-online-lifecycle/CpuOnlineLifecycle"
flow = "cpu-online-lifecycle"
find = '''RejectRestart(cpu) ==
    /\ state[cpu] = Failed
    /\ restartAttempted' = TRUE
    /\ panicRaised' = TRUE
    /\ UNCHANGED <<state, generation, privateReady, schedulerReady,
                   dispatchAuthority, failedSeen, staleGenerationAttempted>>'''
replace = '''RejectRestart(cpu) ==
    /\ state[cpu] = Failed
    /\ state' = [state EXCEPT ![cpu] = Starting]
    /\ restartAttempted' = TRUE
    /\ panicRaised' = FALSE
    /\ UNCHANGED <<generation, privateReady, schedulerReady,
                   dispatchAuthority, failedSeen, staleGenerationAttempted>>'''
occurrence = 1
invariant = "FailedStateIsTerminalForBoot"
min_counterexample_states = 3

