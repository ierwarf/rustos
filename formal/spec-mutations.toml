# --- Cost invariants ------------------------------------------------------
#
# Everything else in this corpus mutates a guard whose absence produces a wrong
# answer. These three mutate a guard whose absence produces the *right* answer
# more slowly, which is the defect class this kernel kept shipping: an
# eight-bind receive, a per-dispatch scan for a value read only at spawn, a
# CPUID triple exit per IPI. All three were correct and none tripped an
# assertion. A cost invariant that no mutation kills is decoration, so each of
# the three has one here.
[[mutation]]
id = "return-foreign-reuse-before-old-mm-retired"
kind = "transition-effect"
severity = "critical"
model = "lifecycle-execution-claim/LifecycleExecutionClaim"
flow = "scheduler-dispatch"
find = '''!.phase = "Finalized", !.census = FALSE, !.oldRetired = TRUE'''
replace = '''!.phase = "Finalized", !.census = FALSE, !.oldRetired = FALSE'''
occurrence = 1
invariant = "ForeignSealedReuse"
min_counterexample_states = 2

