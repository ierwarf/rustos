id = "tlb-retirement-with-live-reference"
kind = "transition-guard-removal"
severity = "critical"
model = "tlb-shootdown-lifecycle/TlbShootdownLifecycle"
flow = "tlb-shootdown-lifecycle"
find = '''BeginRetirement(root) ==
    /\ phase = Idle
    /\ rootState[root] = RootLive
    /\ references[root] = 0
'''
replace = '''BeginRetirement(root) ==
    /\ phase = Idle
    /\ rootState[root] = RootLive
    /\ TRUE
'''
occurrence = 1
invariant = "RetiredRootsOwnNoReference"
min_counterexample_states = 2

[[mutation]]
id = "tlb-same-root-activation-reloads"
kind = "transition-effect"
severity = "high"
model = "tlb-shootdown-lifecycle/TlbShootdownLifecycle"
flow = "tlb-shootdown-lifecycle"
find = "    /\\ lastActivationReloaded' = (activeRoot[cpu] # root)"
replace = "    /\\ lastActivationReloaded' = TRUE"
occurrence = 1
invariant = "SameRootActivationDoesNotReload"
min_counterexample_states = 2

[[mutation]]
id = "user-stack-apply-under-scheduler-lock"
kind = "transition-effect"
severity = "critical"
model = "user-stack-growth/UserStackGrowth"
flow = "exception-retirement"
find = "    /\\ processLock' = TRUE /\\ schedulerRaw' = FALSE"
replace = "    /\\ processLock' = TRUE /\\ schedulerRaw' = TRUE"
occurrence = 2
invariant = "LockDomainsNeverOverlap"
min_counterexample_states = 3

[[mutation]]
id = "user-stack-contention-retired-instead-of-deferred"
