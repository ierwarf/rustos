id = "activation-authority-revoke-removed"
kind = "transition-revocation"
severity = "critical"
model = "atomic-process-activation-batch/AtomicProcessActivationBatch"
flow = "atomic-process-activation-batch"
find = "IF task \\in BatchSet THEN Revoked ELSE authority[task]"
replace = "IF task \\in BatchSet THEN Live ELSE authority[task]"
occurrence = 1
invariant = "ExitedRequesterCannotLeaveActivatableOrphans"
min_counterexample_states = 2

