# the syscall stub and the interrupt stubs both use legacy `movdqu`, which
# preserves bits 255:128 rather than restoring them -- and every VEX-encoded
# instruction rewrites those bits, a 128-bit one by zeroing them. So kernel code
# that executes wide SIMD while a user task's registers are live owns the
# custody, through `wide_simd_section`.
