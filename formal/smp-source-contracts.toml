tokens = [
# The reservation result selects the queue priority; it no longer aborts the
# call. A full donation table is a scheduling condition, and failing the IPC
# turned it into a terminal `ENOSPC` that killed a Wayland client whose
# compositor was writing to it. The ordering that still matters is unchanged:
# sample the reservation before the IPC slot lock, then enqueue, then bind the
# reply.
#
# The final token used to be the invalid-commit cancellation. Binding failure
# was the last condition that reached it, and it had the same defect one step
# later: a donation the scheduler could not install cancelled a syscall that
# had already succeeded, and uiserver died mid thread-spawn on the resulting
# `ENOSPC`. Binding failure now degrades, so what this sequence pins is that
# the degradation is recorded rather than silent.
#
# The admission token is now the fused one. The class query and the reservation
# were two acquisitions of the global scheduler answering two questions about
# one slot, from the same `find_task_slot`; `reserve_ipc_call_donation` is one.
# What this sequence pins is unchanged: admission is sampled before the IPC slot
