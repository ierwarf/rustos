reason = "ring3 transfer bytes must decode through the integer-only ticket wire"

[[forbidden_patterns]]
scope = "kernel/hal/src/arch/clock.rs"
regex = 'const fn tsc_clocksource_admitted\([^)]*\)[^{]*\{\s*true\s*\}'
reason = "raw invariant TSC is not an SMP global clocksource without skew admission"

[[forbidden_patterns]]
scope = "kernel/hal/src/arch/smp.rs"
regex = '\(Self::Failed,\s*Self::Starting\)'
reason = "the boot-static CPU lifecycle cannot reuse generation one after failure"

