# Qualification is a separate kernel-owned authority, not a debug payload
# convention.  The product-milestone dispatcher must remain a thin caller of
# the binding FSM; restoring either historical helper would make the phase
# decision depend on a weaker, payload-adjacent admission path.
[[forbidden_patterns]]
scope = "kernel/compat/src/user/syscall/linux/debug_ops.rs"
regex = '\\b(?:smp_qualification_milestone_admitted|current_process_smp_qualification)\\b'
reason = "SMP qualification phases must use the binding FSM rather than a legacy debug-path gate"

[[forbidden_patterns]]
scope = "kernel/hal/src/arch/idt/handlers.rs"
regex = 'stack_frame\.stack_pointer\.as_u64\(\)\s+as\s+\*const|slice::from_raw_parts'
reason = "user-controlled exception RSP is diagnostic data, never a kernel-readable pointer"

[[forbidden_patterns]]
scope = "kernel/compat/src/user/syscall/linux/service_ops/vfs_meta.rs"
