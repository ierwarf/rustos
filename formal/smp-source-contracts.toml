# An admission predicate and the commit that spends what it admitted. The two
# read the same state at two different times, so they may disagree; the caller
# must treat a refusal as a policy outcome. Registering a pair forbids every
# call site of its commit from sitting inside an `assert!`, `panic!`, or
# `expect`, which is the shape both 8-vCPU scheduler panics had.

# Selection admits a candidate with `is_eligible`, which accepts a refill that
# is merely due; the commit applies that refill and spends the budget. The
# refusal is latched for `scheduling-domain-budget-refused` and the dispatch
# reselects.
