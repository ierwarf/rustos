# A caller's scheduling class and its donation reservation are two questions
# about one scheduler slot, reached through the same `find_task_slot`. Asking
# them separately took the global scheduler lock twice, and masked interrupts
# twice, per IPC call. `reserve_ipc_call_donation` answers both from one entry,
# and only it may be reached from outside the scheduler.
[[forbidden_patterns]]
scope = "kernel/compat/**/*.rs"
regex = '\bmultitask::(?:task_has_system_scheduling_class|reserve_ipc_priority)\s*\('
reason = "the IPC call path admits through reserve_ipc_call_donation, in one scheduler acquisition"

