schema = "rustos-smp-source-contracts-v1"

# These patterns have no valid runtime interpretation in the supported SMP
# envelope. Legitimate BSP boot mechanisms use explicit lifecycle APIs and
# comments; they do not retain a generic single-CPU fallback.
[[forbidden_patterns]]
scope = "kernel/**/*.rs"
regex = '(?m)^[ \t]*(?:pub(?:\([^)]*\))?[ \t]+)?static[ \t]+mut\b'
reason = "mutable kernel statics require a synchronization or immutable-publication owner"

[[forbidden_patterns]]
scope = "kernel/**/*.rs"
regex = '\b(?:hardware_)?apic_id\s*(?:\(\))?\s+as\s+usize\b'
reason = "raw APIC IDs are identities, never dense per-CPU array indexes"

[[forbidden_patterns]]
scope = "kernel/**/*.rs"
regex = '\bcurrent_(?:cpu|logical)_index\(\)\s*\.\s*unwrap_or(?:_default)?\s*\('
reason = "a missing current CPU identity cannot silently become CPU zero"

[[forbidden_patterns]]
scope = "kernel/**/*.rs"
regex = 'RustOS does not claim SMP support'
reason = "the enabled kernel must not retain the obsolete BSP-only product contract"

[[forbidden_patterns]]
scope = "kernel/ps/**/*.rs"
regex = '(?m)^//![ \t]+BSP task scheduler\b'
reason = "runtime scheduler ownership is SMP-wide"

[[forbidden_patterns]]
scope = "kernel/ps/src/multitask/irq.rs"
regex = '(?m)^    crate::arch::rtc::service_clock_event\(\);$'
reason = "the single global deadline base must not be expired independently by every AP clockevent"

[[forbidden_patterns]]
scope = "kernel/ps/src/multitask/scheduler.rs"
regex = 'crate::debug::println!'
reason = "the scheduler raw owner cannot enter synchronous logging"

[[forbidden_patterns]]
scope = "kernel/ps/src/multitask/scheduler.rs"
regex = 'NonNull<Option<LinuxThreadState>>|addr_of_mut!\([^\n]*linux_thread_state'
reason = "scheduler-owned Linux thread state must not escape as an untracked mutable data pointer"

[[forbidden_patterns]]
scope = "kernel/ps/src/multitask/scheduler/linux_thread_state.rs"
regex = 'NonNull<Option<LinuxThreadState>>|addr_of_mut!\([^\n]*linux_thread_state'
reason = "generation binding may point only to the stable tracked lock, never its mutable payload"

[[forbidden_patterns]]
scope = "kernel/ps/src/multitask/scheduler.rs"
regex = 'process_table::replace_for_exec\s*\('
reason = "exec process-state replacement must run only after the scheduler owner is released"

[[forbidden_patterns]]
scope = "kernel/ps/src/multitask/scheduler.rs"
regex = 'map_zeroed_user_pages_at|try_with_process_state_mut'
reason = "recoverable stack mapping belongs to process state after releasing the scheduler raw owner"

[[forbidden_patterns]]
scope = "kernel/hal/src/arch/simd.rs"
regex = '(?i)(?:required_bytes|state_bytes|xsave_bytes)[^\n=]*=[^\n;]*xsave_leaf\.eax'
reason = "CPUID.0Dh:0 EAX is an XCR0 feature bitmap; enabled XSAVE byte size comes from EBX"

[[forbidden_patterns]]
scope = "kernel/**/*.rs"
regex = 'shared_futex_word_phys|FutexKey::Shared\s*\{\s*word_phys'
reason = "shared futex identity must use stable generational backing plus offset, never a physical frame"

[[forbidden_patterns]]
scope = "kernel/ps/src/multitask/scheduler.rs"
regex = '(?s)pub\(super\) fn reap_inactive_retired_slots[^{]*\{(?:(?!\n    pub\(super\) fn).)*process_table::reap_exited_processes\s*\('
reason = "process destruction must run after the scheduler raw owner is released"

[[forbidden_patterns]]
scope = "kernel/ps/src/multitask/scheduler.rs"
regex = 'kernel_hal::api::arch::rtc::disarm_sleep_waiter|kernel_ipc_runtime::api::(?:remove_endpoint_waiters_for_task|cancel_endpoint_calls_for_task|fail_endpoints_owned_by_(?:task|process))'
reason = "timer and IPC retirement side effects must run after the scheduler raw owner is released"

[[forbidden_patterns]]
scope = "kernel/ps/src/multitask/scheduler.rs"
regex = '(?s)fn retire_exec_sibling_slot[^{]*\{(?:(?!\n    fn).)*process_table::detach_task\s*\('
reason = "exec sibling process detachment must run from deferred side-effect custody"

[[forbidden_patterns]]
scope = "kernel/compat/src/user/syscall/linux/proc_broker_ops/activation_batch.rs"
