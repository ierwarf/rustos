CONSTANTS
    Files = {"rootd", "loaderd"}
    Digests = {"good-rootd", "good-loaderd", "bad"}
    MaxMutationAttempts = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    VerifiedContentMatchesManifest
    BadContentNeverVerifies
    RejectedMutationNeverChangesContent
    TerminalReadHasExactEvidenceShape

PROPERTIES
    PendingEventuallySettles
