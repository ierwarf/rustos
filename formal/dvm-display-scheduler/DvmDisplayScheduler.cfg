CONSTANTS
    NormalPolicy = "normal"
    RoundRobinPolicy = "round-robin"
    NoPolicy = "no-process"
    DisplayPriority = 9
    InputPriority = 10
    SoftBudgetUs = 50000
    HardBudgetUs = 100000
