CONSTANTS
    Services = {"syscalld", "loaderd"}
    MaxRestarts = 2
    Backoff = 2
    MaxTick = 5
    LifecycleEvents = {"exit-1", "exit-2"}

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT OnlyRunningLeasePublishesAuthority
INVARIANT PendingOrTerminalLeaseHasNoAuthority
INVARIANT NoRetryAuthorityBeforePublishedDeadline
INVARIANT PendingRestartDoesNotOutliveDeadline
INVARIANT RestartBudgetIsFiniteAndMonotonic
INVARIANT HealthySupervisorHasNoFailedActivationChild
INVARIANT FailedActivationChildCannotPublish
INVARIANT IncompleteLifecycleEvidenceStopsSupervisor
INVARIANT PartialLifecycleCopyoutRetainsEvidence
INVARIANT LifecycleDrainIdentityIsExact
INVARIANT RootLifecycleEvidenceIsNeverLost
INVARIANT PolicyRebaseCannotConsumeRootEvidence
INVARIANT SyscallRebaseCannotConsumeRootEvidence

PROPERTY PendingRestartEventuallySettles
PROPERTY LifecycleWorkEventuallySettlesOrFailsClosed
