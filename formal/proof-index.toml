# Curated retrieval graph for executable and ghost proofs. It is deliberately
# closed-world: a proof cannot be credited unless its source counterpart,
# formal-model anchor, harness/lemma, dependency edge, and stated scope all
# validate mechanically. This is evidence routing, not an auto-prover.
schema = "rustos-proof-index-v1"

[policy]
max_verus_files = 10
max_dependency_depth = 8

