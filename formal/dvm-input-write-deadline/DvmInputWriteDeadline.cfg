CONSTANTS
    NormalFrames = {"session-start", "key"}
    CleanupFrames = {"session-end", "release"}
    FrameBytes = 4
    MaxRetries = 3
    MaxBufferedFrames = 4
    CleanupReserve = 1

INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT ModelBoundsAreSane
INVARIANT AcceptedAccountingIsExact
INVARIANT NoFrameBeforeRustosReceiverReady
INVARIANT FifoIsBounded
INVARIANT NormalTrafficPreservesCleanupReserve
INVARIANT AdmittedFramesAreNeverDuplicated
INVARIANT PartialWriteKeepsItsHeadUncommitted
INVARIANT FailedRelayIsExplicitAndUncommitted
INVARIANT CleanCloseDrainsExactly
