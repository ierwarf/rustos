# User interface settings read by services/uiserver at startup.
#
# This file ships in the ui-assets data package, installed at /assets/ui, and
# the server finds it through RUSTOS_UI_CONFIG. Font files are named relative
# to this file. The server build pre-rasterizes these defaults for immediate
# startup text and uses this clock offset from the first desktop frame. The
# installed config (or RUSTOS_UI_CONFIG override) loads asynchronously and is
# promoted with its fonts and clock offset together between rendered frames.
# Edit the values and rebuild the server/image to change the startup defaults.

[clock]
# RustOS keeps UTC and has no timezone database, so the local time on the home
# screen is UTC plus this offset, in minutes east of UTC.
# Korea Standard Time is 540; UTC is 0; US Eastern Standard Time is -300.
utc_offset_minutes = 540

# Text roles. `size` is the pixel size; `line_height` defaults to the face's
# own. `charset` is `ascii` (default) or `clock` (digits, colon, space).

# Home screen date line and other larger labels.
[font.ui_large]
file = fonts/Inter-SemiBold.ttf
size = 18
line_height = 22

# Window titles and app labels.
[font.ui_medium]
file = fonts/Inter-SemiBold.ttf
size = 15
line_height = 20

# The home screen time of day.
[font.clock]
file = fonts/Inter-Light.ttf
size = 88
charset = clock

# Terminal cells. Must be a monospace face.
[font.terminal]
file = fonts/MapleMono-Regular.ttf
size = 16
line_height = 20
monospace = true
