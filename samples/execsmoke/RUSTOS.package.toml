id = "execsmoke"
kind = "sample"
profiles = ["default"]

[build]
builder = "c-demo"
source = "exec_smoke.c"
output_name = "execsmoke.elf"
extra_args = ["-pthread"]

[install]
path = "samples/execsmoke/execsmoke.elf"

[boot]
preload = true
required = false
priority = 110

[[desktop.entries]]
display_name = "execve smoke"
weight_micros = 50
args = ["samples/execsmoke/execsmoke.elf", "execve"]

[[desktop.entries]]
display_name = "execveat smoke"
weight_micros = 50
args = ["samples/execsmoke/execsmoke.elf", "execveat"]

[[desktop.entries]]
display_name = "exec thread smoke"
weight_micros = 50
args = ["samples/execsmoke/execsmoke.elf", "thread-execve"]

[[desktop.entries]]
display_name = "exec empty argv smoke"
weight_micros = 50
args = ["samples/execsmoke/execsmoke.elf", "empty-argv"]
