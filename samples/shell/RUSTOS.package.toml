id = "shell"
kind = "sample"
profiles = ["default"]

[build]
builder = "c-demo"
source = "shell.c"
output_name = "shell.elf"

[install]
path = "samples/shell/shell.elf"

[boot]
preload = true
required = false
priority = 100

[[desktop.entries]]
display_name = "shell"
weight_micros = 50
launch = "new-session"
