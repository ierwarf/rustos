# RustOS OMP profile
# Goal: long-horizon coding with low context churn / low polling overhead.

defaultThinkingLevel: high

modelRoles:
  # Main implementation / reasoning
  default: openai-codex/gpt-5.6-sol:high

  # Cheap navigation / small tasks
  smol: openai-codex/gpt-5.6-luna:medium
  tiny: openai-codex/gpt-5.6-luna:low

  # Parallel/subagent work
  task: openai-codex/gpt-5.6-terra:xhigh

  # Planning/review
  plan: openai-codex/gpt-5.6-sol:high
  advisor: openai-codex/gpt-5.6-sol:high

  # Difficult escalation
  slow: openai-codex/gpt-5.6-sol:xhigh

  # Commit-message/background-ish work
  commit: openai-codex/gpt-5.6-luna:medium

cycleOrder:
  - smol
  - default
  - slow

tools:
  # 0 = don't impose an extra global ceiling.
  maxTimeout: 0

  # Rust compiler/formal output often has absurdly long lines.
  outputMaxColumns: 384

  # Default is 50 KB. Much too high for RustOS.
  # Spill large results to artifact:// instead of feeding all of them
  # into every subsequent model request.
  artifactSpillThreshold: 12
  artifactHeadBytes: 4
  artifactTailBytes: 6
  artifactTailLines: 100

  intentTracing: true

read:
  # RustOS already wants bounded/focused reads.
  # OMP default is 300 lines.
  defaultLimit: 120
  toolResultPreview: false

  summarize:
    enabled: true
    # Don't unexpectedly summarize contracts/docs.
    prose: false

edit:
  mode: hashline
  fuzzyMatch: true
  fuzzyThreshold: 0.95
  blockAutoGenerated: true

bash:
  enabled: true

  # Let normal build/check commands wait synchronously.
  # Only genuinely long commands become jobs.
  autoBackground:
    enabled: true
    thresholdMs: 120000

# Stops the model doing `rg`, `cat`, etc. through raw bash when
# OMP's bounded read/grep tools are a better fit.
bashInterceptor:
  enabled: true

async:
  enabled: true
  # Don't let an agent accidentally launch a dozen expensive builds.
  maxJobs: 4

lsp:
  enabled: true

  # Important for a repo this big: don't start rust-analyzer just because
  # OMP launched.
  lazy: true

  # Reuse rust-analyzer between OMP processes.
  shared: true

  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
  diagnosticsDeduplicate: true
  formatOnWrite: false

compaction:
  enabled: true
  strategy: snapcompact

  # Catch a context explosion in the middle of a long tool loop.
  midTurnEnabled: true

  # Use OMP's reserve-based calculation rather than compacting
  # prematurely at an arbitrary 70–80%.
  thresholdPercent: -1
  thresholdTokens: -1

  # Slightly more recent exact history than the 20k default.
  keepRecentTokens: 24000

  remoteEnabled: true
  autoContinue: true

# Don't spend model turns maintaining a second memory system.
memory:
  backend: off

autolearn:
  enabled: false
  autoContinue: false

providers:
  openaiWebsockets: auto

# Designed specifically to preserve stable prompt/tool prefixes for
# provider caches. Keep auto first; A/B test "on" separately if desired.
provider:
  appendOnlyContext: auto
