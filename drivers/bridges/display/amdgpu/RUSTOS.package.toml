id = "amdgpu"
kind = "bridge-driver"
execution_domain = "kernel"
profiles = ["hardware-dev"]

[build]
builder = "module-image"
package = "rustos-amdgpu-driver"
crate_name = "rustos_amdgpu_driver"
dependency_crates = ["driver_module_runtime", "driver_abi"]

[install]
path = "system/drivers/display/amdgpu.ko"

[boot]
preload = true
required = false
priority = -300

startup = "none"

[autoload]
name = "amdgpu"
class = "display"
bus = "pci"
priority = 10
when = "vfs-ready"
aliases = ["pci:v00001002d*sv*sd*bc03sc*i*"]
provider_group = "display-primary"
