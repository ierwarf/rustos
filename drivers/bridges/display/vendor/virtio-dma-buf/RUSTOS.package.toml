id = "virtio_dma_buf"
kind = "bridge-driver"
execution_domain = "kernel"
profiles = ["default"]

[build]
builder = "external-copy"
source = "/lib/modules/6.17.0-35-generic/kernel/drivers/virtio/virtio_dma_buf.ko.zst"
source_env = "VENDOR_VIRTIO_DMA_BUF_KO"
optional = true

[install]
path = "system/drivers/display/virtio_dma_buf.ko"

[boot]
preload = true
required = false
priority = 175

startup = "none"

[autoload]
name = "virtio_dma_buf"
class = "display"
bus = "virtio"
priority = 35
when = "vfs-ready"
aliases = ["virtio:d00000010v*"]
linux_driver_names = ["virtio_dma_buf"]
