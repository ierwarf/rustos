id = "virtio-gpu"
kind = "bridge-driver"
execution_domain = "kernel"
profiles = ["default"]

[build]
builder = "external-copy"
source = "vendor/modules/display/virtio-gpu.ko"
source_env = "VENDOR_VIRTIO_GPU_KO"
optional = true

[install]
path = "system/drivers/display/virtio-gpu.ko"


[autoload]
# The default KVM profile always exposes one modern virtio-gpu PCI function.
# Keep loading device- and alias-gated in driverd; bootfb remains the explicit
# fallback if the provider cannot publish.
enabled = true
name = "virtio-gpu"
class = "display"
bus = "virtio"
priority = 20
when = "vfs-ready"
aliases = ["virtio:d00000010v*"]
deps = ["virtio_dma_buf"]
provider_group = "display-primary"
linux_driver_names = ["virtio_gpu"]
