id = "bootfb"
kind = "bridge-driver"
execution_domain = "kernel"
profiles = ["default"]

[build]
builder = "module-image"
package = "rustos-bootfb-driver"
crate_name = "rustos_bootfb_driver"
dependency_crates = ["driver_module_runtime", "driver_abi"]

[install]
path = "system/drivers/display/bootfb.ko"


[autoload]
name = "bootfb"
class = "display"
bus = "platform"
priority = 5000
when = "vfs-ready"
aliases = ["platform:bootfb"]
provider_group = "display-primary"
fallback_only = true
