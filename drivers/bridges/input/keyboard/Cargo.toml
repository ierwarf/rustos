[package]
name = "rustos-keyboard-driver"
version = "0.1.0"
edition = "2024"
publish = false

[features]
module-image = []

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
bitflags = { version = "2.11", default-features = false }
driver-abi = { path = "../../../libs/driver-abi" }
keyboard-core = { path = "../../../libs/keyboard-core" }
