id = "hid-generic"
kind = "bridge-driver"
execution_domain = "kernel"
profiles = ["default"]

[build]
builder = "external-copy"
source = "vendor/modules/input/hid-generic.ko"
source_env = "VENDOR_HID_GENERIC_KO"
optional = true

[install]
path = "system/drivers/input/hid-generic.ko"


[autoload]
name = "hid-generic"
class = "input"
bus = "usb"
# Keep the .ko artifact staged for ring0 compatibility work, but do not
# autoload it until the Linux HID attach path is non-blocking under QEMU USB.
enabled = false
priority = 120
when = "vfs-ready"
aliases = ["hid:b*g*v*p*"]
deps = ["hid"]
provider_group = "input-hid-device"
