id = "hid-generic"
kind = "bridge-driver"
execution_domain = "kernel"
profiles = ["legacy-input-compat"]

[build]
builder = "external-copy"
source = "vendor/modules/input/hid-generic.ko"
source_env = "VENDOR_HID_GENERIC_KO"
optional = true

[install]
path = "system/drivers/input/hid-generic.ko"


[autoload]
name = "hid-generic"
class = "input"
bus = "usb"
# The default KVM path uses the isolated Linux DVM input relay. Keep this
# artifact only for an explicit legacy physical-input compatibility image.
# It remains disabled until the Linux HID attach path is non-blocking under
# sustained QEMU USB traffic.
enabled = false
priority = 120
when = "vfs-ready"
aliases = ["hid:b*g*v*p*"]
deps = ["hid"]
provider_group = "input-hid-device"
