id = "usbhid"
kind = "bridge-driver"
execution_domain = "kernel"
profiles = ["default"]

[build]
builder = "external-copy"
source = "vendor/modules/input/usbhid.ko"
source_env = "VENDOR_USBHID_KO"
optional = true

[install]
path = "system/drivers/input/usbhid.ko"


[autoload]
name = "usbhid"
class = "input"
bus = "usb"
# Keep the .ko artifact staged for ring0 compatibility work, but do not
# autoload it until Linux USB HID URB completion can survive sustained QEMU
# tablet traffic without stalling the heartbeat. Native RustOS HID input remains
# the active boot input provider in the meantime.
enabled = false
priority = 110
when = "vfs-ready"
aliases = ["usb:v*p*d*dc*dsc*dp*ic03isc*ip*in*"]
deps = ["hid"]
provider_group = "input-pointer-transport"
