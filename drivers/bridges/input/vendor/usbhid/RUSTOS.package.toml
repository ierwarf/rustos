id = "usbhid"
kind = "bridge-driver"
execution_domain = "kernel"
profiles = ["legacy-input-compat"]

[build]
builder = "external-copy"
source = "vendor/modules/input/usbhid.ko"
source_env = "VENDOR_USBHID_KO"
optional = true

[install]
path = "system/drivers/input/usbhid.ko"


[autoload]
name = "usbhid"
class = "input"
bus = "usb"
# The default KVM path uses the isolated Linux DVM input relay. Keep this
# artifact only for an explicit legacy physical-input compatibility image.
# It remains disabled until Linux USB HID URB completion can survive sustained
# QEMU tablet traffic without stalling the heartbeat.
enabled = false
priority = 110
when = "vfs-ready"
aliases = ["usb:v*p*d*dc*dsc*dp*ic03isc*ip*in*"]
deps = ["hid"]
provider_group = "input-pointer-transport"
