id = "psmouse"
kind = "bridge-driver"
execution_domain = "kernel"
profiles = ["legacy-input-compat"]

[build]
builder = "external-copy"
source = "vendor/modules/input/psmouse.ko"
source_env = "VENDOR_PSMOUSE_KO"
optional = true

[install]
path = "system/drivers/input/psmouse.ko"


[autoload]
name = "psmouse"
class = "input"
bus = "serio"
# The default KVM path receives pointer events through Linux DVM inputd.
# Keep PS/2 probing as an explicit physical-input compatibility fallback.
priority = 900
when = "vfs-ready"
aliases = ["serio:ty05pr*id*ex*", "serio:ty01pr*id*ex*"]
provider_group = "input-pointer-transport"
fallback_only = true
