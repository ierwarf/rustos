id = "hid"
kind = "bridge-driver"
execution_domain = "kernel"
profiles = ["input-dev"]

[build]
builder = "external-copy"
source = "vendor/modules/input/hid.ko"
source_env = "VENDOR_HID_KO"
optional = true

[install]
path = "system/drivers/input/hid.ko"


[autoload]
name = "hid"
class = "input"
bus = "usb"
priority = 100
when = "vfs-ready"
aliases = ["usb:v*p*d*dc*dsc*dp*ic03isc*ip*in*"]
provider_group = "input-hid-core"
