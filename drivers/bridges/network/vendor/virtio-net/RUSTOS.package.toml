id = "virtio-net"
kind = "bridge-driver"
execution_domain = "kernel"
profiles = ["network-dev"]

[build]
builder = "external-copy"
source = "vendor/network/virtio_net.ko"
source_env = "VENDOR_VIRTIO_NET_KO"
optional = true

[install]
path = "system/drivers/network/virtio_net.ko"


[autoload]
name = "virtio_net"
class = "network"
bus = "virtio"
priority = 100
when = "vfs-ready"
aliases = ["virtio:d00000001v*"]
linux_driver_names = ["virtio_net"]
provider_group = "network-primary"
